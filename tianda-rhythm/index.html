<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
</head>
<body>
<title>天打雷劈 节奏版</title>
<style>
/* Layout: full-bleed storm canvas; HUD pinned to the safe edges; rhythm lane drawn on canvas above the bottom hint */
:root{
  --night:#0a0c1d; --storm:#1b1f3f; --panel:rgba(13,15,36,.9); --line:#2e3466;
  --volt:#bfe6ff; --volt-hot:#ffffff; --amber:#ffc94a; --alarm:#ff4d5e; --ink:#e9ecff; --mute:#959bc8;
  --display:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud-l{display:grid;gap:2px;min-width:0}
.lv{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--volt-hot)}
.tg{font-size:12px;color:var(--mute)}
.hud-r{display:grid;justify-items:end;gap:6px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--volt);background:rgba(10,12,29,.6);letter-spacing:.06em}
.chip.y{color:#1b1400;background:var(--amber);border-color:var(--amber)}
.chip.r{color:#fff;background:var(--alarm);border-color:var(--alarm)}
.prog{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog b{color:var(--ink);font-size:15px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  display:grid;justify-items:center;gap:10px;pointer-events:none}
.bottom.mid{bottom:auto;top:54%}
.hint{font-size:13px;color:var(--mute);text-align:center;max-width:32em;min-height:1.4em}
.btn{pointer-events:auto;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.12em;border:0;border-radius:14px;
  padding:12px 34px;background:var(--amber);color:#1b1400;cursor:pointer;box-shadow:0 0 0 3px rgba(255,201,74,.25),0 0 28px rgba(255,201,74,.45)}
.btn:focus-visible,.panel button:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;
  box-sizing:border-box;padding:24px 22px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;gap:14px}
.panel h1{margin:0;font-family:var(--display);font-weight:800;font-size:52px;line-height:1;letter-spacing:.08em;color:var(--volt-hot);
  text-shadow:0 0 18px rgba(150,200,255,.7),0 0 2px #fff;text-wrap:balance}
.sub{margin:0;font-size:14px;line-height:1.7;color:var(--ink)}
.how{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:13px;line-height:1.55;color:var(--mute)}
.how b{color:var(--ink);font-weight:700}
.levels{display:grid;gap:6px}
.levels .grp{font-size:12px;color:var(--mute);letter-spacing:.08em;margin-top:6px}
.levels .grp:first-child{margin-top:0}
.levels button,.btns button{font-family:var(--body);font-size:15px;font-weight:700;text-align:left;cursor:pointer;
  border-radius:12px;border:1px solid var(--line);background:#161a38;color:var(--ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.levels button span{font-weight:400;font-size:12px;color:var(--mute)}
.levels button:hover,.btns button:hover{border-color:var(--volt)}
.levels button.best span{color:var(--amber)}
.grade{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;letter-spacing:.1em;text-align:center;color:var(--volt-hot);text-shadow:0 0 22px rgba(150,200,255,.75)}
.grade.miss{color:var(--mute);text-shadow:none}
.rline{text-align:center;font-size:14px;color:var(--ink);margin:0}
.score{text-align:center;font-variant-numeric:tabular-nums;color:var(--mute)}
.score b{font-size:40px;color:var(--amber);font-family:var(--display);font-weight:700}
.stars{text-align:center;font-size:26px;letter-spacing:.2em;color:var(--line)}
.stars .on{color:var(--amber)}
.rows{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.rows dt{color:var(--mute)}
.rows dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.rows dt small{display:block;font-size:11px;opacity:.75}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{justify-content:center}
.btns .primary{background:var(--amber);color:#1b1400;border-color:var(--amber)}
.btns .ghost{grid-column:1/-1;background:transparent}
.sound{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:auto;font-size:12px;
  background:rgba(10,12,29,.6);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.ver{margin:0;font-size:11px;color:var(--mute);text-align:center;opacity:.8}
.setbtn{font-family:var(--body);font-size:14px;font-weight:700;cursor:pointer;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--volt);padding:10px 14px}
.settings{z-index:20;touch-action:auto}
.notice{z-index:15}
.pausep{z-index:18}
.pausep h2{margin:0;font-family:var(--display);font-size:26px;color:var(--volt-hot);text-align:center}
.pausep .sub:empty{display:none}
.pausebtn{right:auto;left:16px}
.notice h2{margin:0;font-family:var(--display);font-size:24px;color:var(--amber)}
.notice .sub{white-space:pre-line}
.settings h2{margin:0;font-family:var(--display);font-size:24px;color:var(--volt-hot)}
.settings .vol{display:grid;grid-template-columns:1fr;gap:6px;font-size:14px;font-weight:700}
.settings .vol{grid-template-columns:minmax(0,1fr) auto}
.settings .vol span{grid-column:1/-1}
.settings small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.settings input[type=range]{width:100%;accent-color:var(--amber);touch-action:auto;min-height:28px}
.settings .vol b{font-variant-numeric:tabular-nums;color:var(--amber);min-width:2.5em;text-align:right;align-self:center}
.settings .chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;cursor:pointer}
.settings .chk input{width:22px;height:22px;accent-color:var(--amber);margin:0;flex:none}
@media (max-height:620px){.panel h1{font-size:40px}.grade{font-size:48px}}
</style>

<canvas id="c" aria-label="游戏画面"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-l"><div class="lv" id="lvName"></div><div class="tg" id="tgName"></div></div>
  <div class="hud-r"><div class="chip" id="chip">画面稳定</div><div class="prog">第 <b id="prog">1</b> / <span id="progMax">8</span> 轮</div></div>
</div>

<div class="bottom" id="bottom" hidden>
  <div class="hint" id="hint"></div>
  <button class="btn" id="go" hidden>开劈</button>
</div>
<button class="sound" id="sound" hidden>音量</button>
<button class="sound pausebtn" id="pauseBtn" hidden>暂停</button>

<section class="panel" id="menu">
  <h1>天打雷劈</h1>
  <p class="sub">闪电先敲鼓，你再跟着敲。<br>敲对了，就能劈中小坏蛋！</p>
  <ol class="how">
    <li>点一下<b>小坏蛋</b>，再按<b>开劈</b></li>
    <li>闪电敲低沉的“咚”时，<b>先听，别点</b></li>
    <li>画面一暗就轮到你：小球外的<b>金色圆圈缩到和小球一样大</b>时点它，发出清脆的“叮”</li>
    <li><b>最大的球别点</b>，它在给闪电带路</li>
  </ol>
  <div class="levels" id="levels"></div>
  <button class="setbtn" id="openSet">音量和设置</button>
  <p class="ver">版本 10月16日 21:30 · 新音效：动感鼓组 + 电击打击声</p>
</section>

<section class="panel settings" id="settings" hidden>
  <h2>音量和设置</h2>
  <label class="vol" for="v_music"><span>背景音乐<small>动感鼓组循环、音节开头的“嗒”</small></span><input type="range" id="v_music" min="0" max="100" step="5"><b id="l_music">100</b></label>
  <label class="vol" for="v_fx"><span>闪电音效<small>闪电的“咚”、你点中的“啪滋”、回击、劈下、裂地</small></span><input type="range" id="v_fx" min="0" max="100" step="5"><b id="l_fx">50</b></label>
  <label class="vol" for="v_strike"><span>慢动作氛围<small>普通关落地前的慢动作声、远处雷声</small></span><input type="range" id="v_strike" min="0" max="100" step="5"><b id="l_strike">10</b></label>
  <label class="vol" for="v_bpm"><span>速度<small>每分钟多少拍，所有关卡统一；下一局开始生效</small></span><input type="range" id="v_bpm" min="60" max="160" step="2"><b id="l_bpm">130</b></label>
  <label class="chk" for="skipIntro"><input type="checkbox" id="skipIntro"><span>跳过开场<small>选完关卡直接开始，不用点坏蛋、按开劈</small></span></label>
  <button class="btn" id="closeSet">好了</button>
</section>

<section class="panel notice" id="notice" hidden>
  <h2 id="noticeTitle">变奏练习</h2>
  <p class="sub" id="noticeText"></p>
  <button class="btn" id="noticeOk">知道了，开始</button>
</section>

<section class="panel pausep" id="pause" hidden>
  <h2 id="pauseTitle">暂停</h2>
  <p class="sub" id="pauseText"></p>
  <div class="btns">
    <button id="pResume" class="primary">继续</button>
    <button id="pRestart">重来</button>
    <button id="pMenu" class="ghost">回到选关</button>
  </div>
</section>

<section class="panel" id="result" hidden>
  <div class="grade" id="rGrade">天罚</div>
  <p class="rline" id="rLine"></p>
  <div class="score"><b id="rScore">0</b> / 100</div>
  <div class="stars" id="rStars"></div>
  <dl class="rows" id="rRows"></dl>
  <div class="btns">
    <button id="rAgain">再来一次</button>
    <button id="rNext" class="primary">下一关</button>
    <button id="rMenu" class="ghost">回到选关</button>
  </div>
</section>

};

/* ---------------- song clock & schedule ---------------- */
function clock(){
  if (!G.songStarted) return -1;

// what the player actually hears lags the audio clock by the device's output latency
function tapClock(){
  const lat = G.useAC && sfx.ac ? clamp((sfx.ac.outputLatency || 0) + (sfx.ac.baseLatency || 0), 0, 0.25) : 0;

function buildSong(){
  const bt = G.beat;
  G.calls = []; G.resps = []; G.aev = []; G.segs2 = [];
  let cur = G.noCount ? 0 : 4;                     // beats; 0..3 = count-in (skipped between endless layers)
  rounds().forEach((pk, r) => {
    const P = PATTERNS[pk], cs = cur, rs = cur + P.span;
    G.segs2.push({ r, kind:'call', a:cs, b:rs }, { r, kind:'resp', a:rs, b:rs + P.span });
    P.hits.forEach(([h, type], i) => {
      const acc = i === P.hits.length - 1;
      G.calls.push({ t:(cs + h)*bt, type, r, i, acc });
      G.resps.push({ t:(rs + h)*bt, type, r, i, done:false, res:null });
      G.aev.push({ t:(cs + h)*bt, f:'lead' });
    });
    cur = rs + P.span;
  });
  // backing, built segment by segment so the fine pulse always divides the current 音节 evenly
  const drumT = [];
  if (!G.noCount) for (let k = 0; k < 4; k++) G.aev.push({ t:k*bt, f:'stick', a:k === 0 });
  const roots = [110, 130.8, 146.8, 164.8];
  for (const sg of G.segs2){
    const P = PATTERNS[rounds()[sg.r]], n = P.hits.length, span = sg.b - sg.a, t0 = sg.a*bt;
    const even = P.hits.every(([h], i) => Math.abs(h - i*span/n) < 1e-6);
    const step = even ? span/(2*n) : 0.5;                       // 3 hits → 6 ticks, 2 → 4, 1 → 2
    G.aev.push({ t:t0, f:'tick' });                              // soft 嗒 marks the start of each 音节
    for (let x = 0; x < span - 1e-6; x += step) G.aev.push({ t:t0 + x*bt, f:sg.kind === 'call' ? 'shakerLo' : 'shaker' });
    if (sg.kind === 'call') G.aev.push({ t:t0, f:'bass', a:roots[sg.r % roots.length] });
  }
  // lightning's turn: low 雷鼓 on its hits; your turn: clap + bright 叮 on yours
  for (const c of G.calls) drumT.push(c.t);
  for (const q of G.resps){ G.aev.push({ t:q.t, f:'clap' }); G.aev.push({ t:q.t, f:'ding' }); drumT.push(q.t); }
  // the lightning moves on every drum hit: big step + branch on its own 咚/锵, small step on the other drum hits

/* ---------------- update ---------------- */
function camTarget(){
  if (G.endless && (G.phase === 'land' || G.phase === 'finale' || G.phase === 'descend')){
    if (G.phase === 'finale' && G.rb && G.ft < FIN.impact){
      const p = G.ft < FIN.climbEnd ? boltPointAt(climbFrac()) : boltPointAt(1 - downFrac());
      const s = clamp(S.full*1.5/(G.layer + 1), S.full*0.3, S.levels[0]*0.6);
      return { x:p.x*0.5 + ((G.ox || 0) + G.winner.x)*0.25, y:p.y, s, sp:G.ft < FIN.climbEnd ? 9 : 14 };
    }
    const t = G.phase === 'descend' ? G.dive : G.phase === 'finale' ? G.winner : G.main;
    const [x, y] = tipPos(t);
    if (G.phase === 'descend'){ const s = S.levels[0]*0.6; return { x, y:y + 0.12*H/s, s, sp:5 }; }   // tip upper-middle: split ground stays in view
    const s = Math.max(Math.min(cam.s, S.levels[0]*0.8), S.levels[0]*0.55);
    return { x, y:y + 0.08*H/s, s, sp:7 };
  }
  if ((G.phase === 'finale' || G.phase === 'result') && G.rb){
    const ft = G.ft;
    if (ft < FIN.pause) return { x:cam.x, y:cam.y, s:cam.s };
    if (ft < FIN.climbEnd){ const p = boltPointAt(climbFrac()), s = S.levels[0]*1.1; return { x:p.x, y:p.y - 0.08*H/s, s, sp:14 }; }
    if (ft < FIN.impact){
      if (G.endless && G.layer > 0){
        const f = clamp((ft - FIN.climbEnd)/(FIN.impact - FIN.climbEnd - 0.05), 0, 1), p = boltPointAt(1 - f*f);
        return { x:p.x, y:p.y, s:S.levels[0]*0.6, sp:16 };
      }
      return { x:((G.ox || 0) + tgtX())/2, y:GROUND/2 + 2, s:S.full, sp:7 };
    }
    if (G.outcome === 'hit'){
      // frame both the smoking villain and the thankful animal
      const v = villain(), vc = victimObj(), dx = Math.abs(v.x - vc.x) + 4.2;
      const s2 = Math.max(S.full, Math.min(S.levels[0]*0.8, S.playW*0.92/dx));
      return { x:(v.x + vc.x)/2, y:GROUND - 2.2, s:s2, sp:4 };
    }
    return { x:G.winner.x, y:GROUND - 2.2, s:S.levels[0]*0.8, sp:4 };
  }
  if (G.phase === 'land'){
    const b = bbox([G.main]);

    const s2 = Math.max(S.full, Math.min(S.levels[0]*1.3, H*0.72/bh));

  }

    const s = fitScale();
    const b = bbox(G.tips);
    return { x:(b.x0 + b.x1)/2, y:(b.y0 + b.y1)/2 + 0.12*H/s, s };
  }
  return { x:0, y:GROUND/2 + 2, s:S.full };
}
function update(dt){
  G.t += dt;
  const slowWorld = (G.phase === 'play' && G.inResp) || (!G.endless && (G.phase === 'land' || (G.phase === 'finale' && G.ft < FIN.impact)));
  const rdt = dt*(slowWorld ? 0.15 : 1);
  for (const d of rain){ d.y += d.v*rdt; d.x -= d.v*0.18*rdt; if (d.y > H + 30) Object.assign(d, newDrop(false)); }
  if (G.phase === 'play' || G.phase === 'zoomin' || G.phase === 'land') G.playT += rdt;
  const v = villain();
  if (v.state === 'idle' && v.amp && (G.phase === 'play' || G.phase === 'zoomin' || G.phase === 'land')){
    const nx = v.x0 + v.amp*Math.sin(G.playT*v.freq*2); if (Math.abs(nx - v.x) > 1e-4) v.dir = nx > v.x ? 1 : -1; v.x = nx;

  if (vc.state === 'grateful'){
    vc.thankT += dt;
    if (vc.hopTo != null) vc.x += (vc.hopTo - vc.x)*Math.min(1, dt*5);
    if (Math.random() < dt*4) G.parts.push({ x:vc.x + rnd(-0.4, 0.4), y:GROUND - 1.2, vx:rnd(-0.4, 0.4), vy:-1.4, life:1.4, max:1.4, c:'#ff7a9a', sz:rnd(4, 6), g:0, heart:true });
  }
  if (G.shock) G.shock.t += dt;
  if (G.boomText) G.boomText.t += dt;
  for (const o of G.objs){
    if (o.state === 'char' && Math.random() < dt*7) G.parts.push({ x:o.x + rnd(-0.3, 0.3), y:GROUND - 1.1, vx:rnd(-0.3, 0.3), vy:rnd(-1.6, -0.9), life:1.6, max:1.6, c:'#6a6d80', sz:rnd(4, 8), g:-0.2, smoke:true });
    if (o.state === 'spark' && Math.random() < dt*10) G.parts.push({ x:o.x + rnd(-0.6, 0.6), y:GROUND - 2.6, vx:rnd(-2, 2), vy:rnd(-2, 1), life:0.4, max:0.4, c:'#bfe6ff', sz:2, g:6 });

      if (bi.kind === 'call'){
        bigText('听', '#bfe6ff', 0.5); G.levelBars[G.level]++;
        setTxt('prog', String(bi.r + 1));
        { const pk = rounds()[bi.r]; if ((bi.r === 0 && !(G.endless && G.layer > 0)) || (bi.r > 0 && pk !== rounds()[bi.r - 1])) screenText(`这次敲 ${HITS_LABEL[pk]}`, '#d2aaff', 22); }
        setHint('先听，别点');
      } else if (bi.kind === 'resp'){
        const nx = rounds()[bi.r + 1], cu = rounds()[bi.r];
        if (nx && PATTERNS[nx].hits.length !== PATTERNS[cu].hits.length) screenText(`下一轮：闪电敲 ${PATTERNS[nx].hits.length} 下`, '#d2aaff', 20);
        bigText('跟！', '#ffc94a', 0.5); startResp(bi.r); setHint('跟着节奏点小球，大球别点'); }

      { const tn = tapClock(); for (const q of G.resps) if (!q.done && tn > q.t + WIN_G) judgeMiss(q); }
      if (bi.kind === 'count' && !G.noCount){ const n = 4 - Math.floor(now/G.beat); if (n >= 1 && n <= 4 && G.lastCount !== n){ G.lastCount = n; bigText(String(n), '#e9ecff', 0.55); } }
    }
  }

  gridDrums();
  if (G.phase === 'finale' || G.phase === 'result'){
    G.ft += dt;
    if (!G.cracked && G.ft >= FIN.pause){ G.cracked = true; sfx.crack(); G.shake = RM ? 0 : 0.15; G.flash = 0.25; }
    if (!G.risered && G.ft >= Math.max(0, FIN.climbEnd - 0.76)){ G.risered = true; sfx.riser(sfx.now()); }

  const ft = G.ft, thick = G.power >= 25 ? 9 : G.power >= 12 ? 5.5 : 2.6;
  let a, base, front = null;
  if (ft < FIN.climbEnd){ front = boltPointAt(climbFrac()); a = 1; base = 2.2; }
  else if (ft < FIN.impact && G.endless){ front = boltPointAt(1 - downFrac()); front.down = true; a = 1; base = 3.2; }
  else if (ft < FIN.impact){ a = 0.75 + 0.25*Math.sin(ft*70); base = 2.4; }
  else { a = boltAlpha(ft - FIN.impact); base = thick; }
  if (a <= 0) return;
  base *= clamp(cam.s/S.full, 1, front ? 2.4 : 1.6);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const path = () => {
    ctx.beginPath();
    if (front && front.down){
      const [fx, fy] = w2s(front.x, front.y); ctx.moveTo(fx, fy);
      for (let i = front.i; i < G.rb.length; i++){ const [x, y] = w2s(G.rb[i].x, G.rb[i].y); ctx.lineTo(x, y); }
    } else if (front){
      for (let i = 0; i < front.i; i++){ const [x, y] = w2s(G.rb[i].x, G.rb[i].y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      const [fx, fy] = w2s(front.x, front.y); ctx.lineTo(fx, fy);
    } else G.bolt.forEach((p, i) => { const [x, y] = w2s(p.x, p.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  };
  path(); ctx.strokeStyle = `rgba(120,160,255,${0.25*a})`; ctx.lineWidth = base*6; ctx.stroke();
  path(); ctx.strokeStyle = `rgba(190,220,255,${0.55*a})`; ctx.lineWidth = base*2.2; ctx.stroke();
  path(); ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = base; ctx.stroke();
  if (front){
    const [fx, fy] = w2s(front.x, front.y), R = 34 + 8*Math.sin(ft*50);
    const rg = ctx.createRadialGradient(fx, fy, 0, fx, fy, R);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.35, 'rgba(200,225,255,0.8)'); rg.addColorStop(1, 'rgba(150,190,255,0)');
    ctx.fillStyle = rg; circle(fx, fy, R);

  ctx.restore();
}
function drawParts(){
  for (const p of G.parts){
    const [sx, sy] = w2s(p.x, p.y), a = clamp(p.life/p.max, 0, 1);
    if (p.smoke){ ctx.fillStyle = `rgba(110,112,130,${0.35*a})`; circle(sx, sy, p.sz*(2 - a)*cam.s/22); continue; }
    ctx.fillStyle = p.c; ctx.globalAlpha = a;
    if (p.rock){ ctx.fillRect(sx - p.sz/2, sy - p.sz/2, p.sz, p.sz); ctx.globalAlpha = 1; continue; }
    if (p.heart){ ctx.font = `${p.sz*3}px ${FONT_B}`; ctx.textAlign = 'center'; ctx.fillText('♥', sx, sy); ctx.globalAlpha = 1; continue; }
    if (p.feather){ ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.life*3); ctx.fillRect(-p.sz, -p.sz/3, p.sz*2, p.sz*0.7); ctx.restore(); }
    else circle(sx, sy, p.sz);
    ctx.globalAlpha = 1;
  }
}
function drawTexts(world){
  ctx.textAlign = 'center';
  for (const t of G.texts){
    if (t.world !== world) continue;
    const a = clamp(t.life/t.max*2, 0, 1), rise = (1 - t.life/t.max)*30;
    let x, y; if (world){ [x, y] = w2s(t.x, t.y); } else { x = t.sx; y = t.sy; }
    ctx.font = `bold ${t.sz}px ${FONT_D}`; ctx.globalAlpha = a;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(8,10,24,0.85)'; ctx.strokeText(t.txt, x, y - rise);
    ctx.fillStyle = t.c; ctx.fillText(t.txt, x, y - rise);
    ctx.globalAlpha = 1;
  }
}

/* ---------------- characters ---------------- */
function ell(x, y, rx, ry, rot){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, 2*PI); ctx.fill(); }
function drawObj(o){
  const [sx, gy] = w2s(o.x, GROUND + (o.fy || 0));

  const u = o.villain ? Math.max(cam.s*VSCALE, 34) : o.victim ? Math.max(cam.s*1.3, 24) : cam.s;
  if (o.kind !== 'pole' && (sx < -u*2 || sx > W + u*2)) return;
  const ch = o.state === 'char' || o.state === 'fall';
  if (o.villain && !ch){

    const rg = ctx.createRadialGradient(sx, gy, 0, sx, gy, u*1.3);
    rg.addColorStop(0, `rgba(255,80,80,${0.35 + 0.2*pulse})`); rg.addColorStop(1, 'rgba(255,80,80,0)');

  }
  ctx.save(); ctx.translate(sx, gy); if (o.spin){ ctx.translate(0, -u*0.4); ctx.rotate(o.spin); ctx.translate(0, u*0.4); ctx.scale(Math.max(0.3, 1 - (o.fy || 0)*0.05), Math.max(0.3, 1 - (o.fy || 0)*0.05)); } ctx.scale(u, u); ctx.lineWidth = 1.5/u;
  if (o.villain && !ch){ ctx.shadowColor = 'rgba(255,70,70,0.95)'; ctx.shadowBlur = 14; }
  const bob = o.state === 'idle' && o.villain ? Math.abs(Math.sin(G.t*(o.amp ? 9 : 3)))*0.06 : o.state === 'flee' ? Math.abs(Math.sin(G.t*18))*0.12 : 0;
  ctx.translate(0, -bob);
  if (o.victim){ drawVictim(o); ctx.restore(); if (G.phase !== 'result' && o.state === 'scared') drawHelpBubble(sx, gy - u*1.1); if (o.state === 'grateful') drawThanksBubble(sx, gy - u*1.15, o); return; }
  if (o.villain && o.state === 'idle') ctx.translate((o.dir || 1)*Math.pow(Math.abs(Math.sin(G.t*3.2)), 4)*0.25, 0);
  if (o.kind === 'pole'){ drawPole(o, u); ctx.restore(); return; }
  if (o.kind === 'hen'){ drawHen(ch); ctx.restore(); return; }
  ctx.scale(o.dir || 1, 1);
  const pal = { weasel:['#b9773d', '#e7c08a'], cat:['#d48a3f', '#f1d2a4'], rat:['#8c8c9a', '#c9c9d4'] }[o.kind];
  const body = ch ? '#18181c' : pal[0], belly = ch ? '#26262c' : pal[1];
  ctx.fillStyle = body;
  if (o.kind === 'rat'){ ctx.strokeStyle = ch ? '#18181c' : '#d9a0a8'; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.moveTo(-0.5, -0.25); ctx.quadraticCurveTo(-1.1, -0.1, -1.2, -0.6); ctx.stroke(); }
  else ell(-0.82, -0.55, 0.38, 0.11, -0.6);
  ell(0, -0.36, o.kind === 'rat' ? 0.55 : 0.72, o.kind === 'cat' ? 0.32 : 0.27);
  ctx.fillStyle = belly; ell(0.1, -0.26, 0.42, 0.13);
  ctx.fillStyle = body; [-0.4, -0.15, 0.25, 0.45].forEach((lx, i) => { const sw = o.state === 'flee' || (o.amp && G.phase === 'play') ? Math.sin(G.t*20 + i*1.6)*0.06 : 0; ctx.fillRect(lx + sw - 0.05, -0.2, 0.1, 0.2); });
  const hx = o.kind === 'rat' ? 0.55 : 0.66, hy = o.kind === 'cat' ? -0.72 : -0.6, hr = o.kind === 'cat' ? 0.3 : 0.26;
  ctx.fillStyle = body;
  if (o.kind === 'cat'){ ctx.beginPath(); ctx.moveTo(hx - 0.25, hy - 0.12); ctx.lineTo(hx - 0.18, hy - 0.45); ctx.lineTo(hx - 0.02, hy - 0.22); ctx.moveTo(hx + 0.05, hy - 0.22); ctx.lineTo(hx + 0.2, hy - 0.45); ctx.lineTo(hx + 0.27, hy - 0.1); ctx.fill(); }
  if (o.kind === 'rat'){ ctx.fillStyle = ch ? '#18181c' : '#d9a0a8'; circle(hx - 0.12, hy - 0.24, 0.13); ctx.fillStyle = body; }
  if (o.kind === 'weasel'){ circle(hx - 0.1, hy - 0.22, 0.08); }
  circle(hx, hy, hr);
  ell(hx + hr*0.85, hy + 0.05, 0.16, 0.11);
  if (!ch && o.kind === 'weasel'){ ctx.fillStyle = '#3a2410'; ell(hx + 0.06, hy - 0.04, 0.24, 0.07); }
  if (!ch && o.kind === 'cat'){ ctx.strokeStyle = '#8a4f1d'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(-0.3, -0.62); ctx.lineTo(-0.25, -0.45); ctx.moveTo(-0.05, -0.66); ctx.lineTo(0, -0.48); ctx.moveTo(0.2, -0.64); ctx.lineTo(0.24, -0.47); ctx.stroke(); }
  ctx.fillStyle = ch ? '#000' : '#2a1a1a'; circle(hx + hr + 0.12, hy + 0.02, 0.045);
  ctx.fillStyle = '#fff'; circle(hx + 0.1, hy - 0.05, ch ? 0.08 : 0.06);
  ctx.fillStyle = '#000'; if (!ch) circle(hx + 0.12, hy - 0.04, 0.03);
  if (!ch){ ctx.strokeStyle = '#1a0f05'; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(hx - 0.02, hy - 0.17); ctx.lineTo(hx + 0.2, hy - 0.11); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx + 0.18, hy + 0.09, 0.07, 0.2, 1.4); ctx.stroke(); }
  if (!ch){
    if (o.state === 'idle'){
      // claw raised toward the victim
      const sw = Math.pow(Math.abs(Math.sin(G.t*3.2)), 4);
      ctx.fillStyle = body; ell(0.55, -0.42 - sw*0.15, 0.28, 0.07, -0.5 - sw*0.4);
      ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 0.035; ctx.beginPath();

    }
  } else { ctx.fillStyle = '#0d0d10'; for (let i = 0; i < 6; i++) circle(hx - 0.25 + i*0.1, hy - 0.3 - Math.sin(i*1.3)*0.08, 0.14); }
  ctx.restore();
  if (o.villain && !ch && G.phase !== 'result') drawVillainTag(sx, gy - u*1.15);
  if (o.villain && o.state === 'char' && !o.fy){
    ctx.save(); ctx.font = `bold ${Math.round(u*0.32)}px ${FONT_B}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffe14a';
    for (let i = 0; i < 3; i++){ const a = G.t*4 + i*2*PI/3; ctx.fillText('★', sx + (o.dir || 1)*u*0.55 + Math.cos(a)*u*0.45, gy - u*1.15 + Math.sin(a)*u*0.12); }

}
function drawVillainTag(x, y){
  const b = Math.abs(Math.sin(G.t*5))*8;
  y -= b;
  ctx.save();
  ctx.font = `800 15px ${FONT_D}`; ctx.textAlign = 'center';
  const w = ctx.measureText('坏蛋').width + 18;
  ctx.fillStyle = '#ff4d5e'; ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x - w/2, y - 34, w, 24, 12) : ctx.rect(x - w/2, y - 34, w, 24); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 7, y - 11); ctx.lineTo(x + 7, y - 11); ctx.lineTo(x, y - 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText('坏蛋', x, y - 16);
  ctx.restore();
}
function drawVictim(o){
  const scared = o.state === 'scared', glad = o.state === 'grateful';
  const shake = scared ? Math.sin(G.t*40)*0.03 : 0;
  // grateful: little hops + deep bows toward the lightning
  const tt = o.thankT || 0, hop = glad ? Math.abs(Math.sin(tt*7))*0.3 : 0, bow = glad ? Math.max(0, Math.sin(tt*3.5))*0.55 : 0;
  ctx.translate(shake, -hop); ctx.scale(o.dir || 1, 1);
  if (bow){ ctx.translate(0.15, 0); ctx.rotate(bow*0.6); ctx.translate(-0.15, 0); }

  let ex = 0.25, ey = -0.64;
  if (o.kind === 'bird'){
    ctx.fillStyle = '#5fb4ff'; ell(0, -0.42, 0.32, 0.24);
    ctx.fillStyle = '#3a8fe0'; ell(-0.05, -0.5, 0.2, 0.08, -0.6 + flap);

    ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.moveTo(0.38, -0.64); ctx.lineTo(0.52, -0.6); ctx.lineTo(0.38, -0.56); ctx.fill();
    ctx.fillStyle = '#3a8fe0'; ctx.beginPath(); ctx.moveTo(-0.28, -0.45); ctx.lineTo(-0.5, -0.55); ctx.lineTo(-0.48, -0.36); ctx.fill();

    ctx.fillStyle = '#fff3a0'; ell(0, -0.3, 0.34, 0.24);
    ctx.fillStyle = '#ffe36a'; ell(-0.08, -0.34, 0.16, 0.07, -0.3 + flap);
    ctx.fillStyle = '#fff3a0'; circle(0.22, -0.6, 0.18);
    ctx.fillStyle = '#ff8c1a'; ell(0.42, -0.56, 0.12, 0.05);
    ctx.fillStyle = '#ff8c1a'; ell(-0.05, -0.03, 0.08, 0.03); ell(0.1, -0.03, 0.08, 0.03);

    ctx.fillStyle = '#ff9a3a'; ell(0, 0, 0.32, 0.16);
    ctx.beginPath(); ctx.moveTo(-0.28, 0); ctx.lineTo(-0.52, -0.16); ctx.lineTo(-0.52, 0.16); ctx.fill();
    ctx.fillStyle = '#ffc070'; ell(0.02, 0.05, 0.16, 0.06);

  } else if (o.kind === 'bunny'){
    ctx.fillStyle = '#f4f0f6'; ell(0, -0.3, 0.3, 0.26);

    ctx.save(); ctx.translate(0.14, -0.78); ctx.rotate(-0.2 + flap*0.15); ell(0, -0.22, 0.06, 0.22); ctx.restore();
    ctx.save(); ctx.translate(0.27, -0.78); ctx.rotate(0.15 - flap*0.15); ell(0, -0.22, 0.06, 0.22); ctx.restore();
    ctx.fillStyle = '#ffb3c8'; ell(0.14, -1.0, 0.025, 0.12, -0.2); ell(0.27, -1.0, 0.025, 0.12, 0.15);
    ctx.fillStyle = '#fff'; circle(-0.28, -0.32, 0.09);
    ctx.fillStyle = '#ff8fb0'; circle(0.39, -0.58, 0.035);

    ctx.fillStyle = '#3fae3f'; ell(-0.2, -0.06, 0.14, 0.05); ell(0.22, -0.06, 0.14, 0.05);

  } else {
    ctx.fillStyle = '#ffd84a'; ell(0, -0.32, 0.3, 0.26);
    ctx.fillStyle = '#ffc61a'; ell(-0.06, -0.36, 0.14, 0.07, -0.4 + flap);
    ctx.fillStyle = '#ffd84a'; circle(0.2, -0.6, 0.18);
    ctx.fillStyle = '#ff9a1a'; ctx.beginPath(); ctx.moveTo(0.34, -0.62); ctx.lineTo(0.48, -0.58); ctx.lineTo(0.34, -0.54); ctx.fill();
    ctx.strokeStyle = '#ff9a1a'; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(-0.06, -0.08); ctx.lineTo(-0.06, 0); ctx.moveTo(0.08, -0.08); ctx.lineTo(0.08, 0); ctx.stroke();

    ctx.fillStyle = 'rgba(255,120,150,0.5)'; ell(ex - 0.08, ey + 0.1, 0.06, 0.035);
  } else {
    ctx.fillStyle = '#fff'; circle(ex, ey, scared ? 0.065 : 0.05);
    ctx.fillStyle = '#000'; circle(ex + 0.01, ey, 0.022);
    if (scared){ ctx.fillStyle = '#9fd4ff'; ell(ex - 0.2, ey - 0.12, 0.035, 0.06); }
  }
}
function drawThanksBubble(x, y, o){
  const lines = THANKS[o.kind] || THANKS.chick, i = Math.floor((o.thankT || 0)/1.3) % lines.length, txt = o.bye ? '拜拜～雷公加油！' : lines[i];
  const pop = Math.min(1, ((o.thankT || 0) % 1.3)/0.12), b = Math.abs(Math.sin(G.t*6))*3;
  ctx.save(); ctx.translate(x, y - b); ctx.scale(0.6 + 0.4*pop, 0.6 + 0.4*pop);

  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#ff7a9a'; ctx.lineWidth = 2; ctx.beginPath();

  ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(6, -9); ctx.lineTo(0, 0); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#e8336a'; ctx.fillText(txt, 0, -16);
  ctx.restore();
}
function drawHelpBubble(x, y){
  const b = Math.abs(Math.sin(G.t*7))*4;
  y -= b;
  ctx.save(); ctx.font = `800 13px ${FONT_D}`; ctx.textAlign = 'center';

  ctx.fillStyle = '#fff'; ctx.beginPath();

  ctx.beginPath(); ctx.moveTo(x - 5, y - 9); ctx.lineTo(x + 5, y - 9); ctx.lineTo(x, y - 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d2283c'; ctx.fillText('救命！', x, y - 13);
  ctx.restore();
}
function drawHen(ch){
  ctx.fillStyle = ch ? '#18181c' : '#f2ede2'; ell(0, -0.45, 0.42, 0.36);
  ell(-0.38, -0.6, 0.16, 0.22, -0.5);
  circle(0.28, -0.88, 0.2);
  ctx.fillStyle = ch ? '#2a2a30' : '#d9342b'; circle(0.24, -1.1, 0.07); circle(0.33, -1.1, 0.07); circle(0.4, -1.03, 0.06);
  ctx.fillStyle = ch ? '#2a2a30' : '#f1b432'; ctx.beginPath(); ctx.moveTo(0.46, -0.9); ctx.lineTo(0.62, -0.84); ctx.lineTo(0.46, -0.79); ctx.fill();
  ctx.fillStyle = '#fff'; circle(0.33, -0.92, ch ? 0.07 : 0.045); if (!ch){ ctx.fillStyle = '#000'; circle(0.34, -0.92, 0.025); }
  ctx.strokeStyle = ch ? '#18181c' : '#f1b432'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(-0.08, -0.1); ctx.lineTo(-0.08, 0); ctx.moveTo(0.1, -0.1); ctx.lineTo(0.1, 0); ctx.stroke();
}
function drawPole(o, u){
  ctx.fillStyle = '#5a4330'; ctx.fillRect(-0.08, -3, 0.16, 3);
  ctx.fillRect(-0.55, -2.65, 1.1, 0.1);
  ctx.fillStyle = '#9fb0c8'; circle(-0.45, -2.7, 0.06); circle(0.45, -2.7, 0.06);
  ctx.strokeStyle = 'rgba(40,40,60,0.9)'; ctx.lineWidth = 1/u; ctx.beginPath();

  ctx.stroke();
  if (o.state === 'spark'){ ctx.fillStyle = `rgba(190,230,255,${0.5 + 0.5*Math.sin(G.t*40)})`; circle(0, -2.7, 0.25); }
}

/* ---------------- boot ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (G.hitStop > 0){ G.hitStop -= dt; G.flash = Math.max(G.flash, 0.6); }
  else if (!G.paused){ if (G.slowT > 0){ G.slowT -= dt; update(dt*0.3); } else update(dt); }
  render(); requestAnimationFrame(frame);
}
addEventListener('resize', resize);
newGame(0, 'menu'); resize(); buildMenu();
requestAnimationFrame(frame);
})();
