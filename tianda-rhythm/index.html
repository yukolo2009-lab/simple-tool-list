<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>天打雷劈 节奏版</title>
<style>
/* Layout: full-bleed storm canvas; HUD pinned to the safe edges; rhythm lane drawn on canvas above the bottom hint */
:root{
  --night:#0a0c1d; --storm:#1b1f3f; --panel:rgba(13,15,36,.9); --line:#2e3466;
  --volt:#bfe6ff; --volt-hot:#ffffff; --amber:#ffc94a; --alarm:#ff4d5e; --ink:#e9ecff; --mute:#959bc8;
  --display:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud-l{display:grid;gap:2px;min-width:0}
.lv{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--volt-hot)}
.tg{font-size:12px;color:var(--mute)}
.hud-r{display:grid;justify-items:end;gap:6px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--volt);background:rgba(10,12,29,.6);letter-spacing:.06em}
.chip.y{color:#1b1400;background:var(--amber);border-color:var(--amber)}
.chip.r{color:#fff;background:var(--alarm);border-color:var(--alarm)}
.prog{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog b{color:var(--ink);font-size:15px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  display:grid;justify-items:center;gap:10px;pointer-events:none}
.bottom.mid{bottom:auto;top:54%}
.hint{font-size:13px;color:var(--mute);text-align:center;max-width:32em;min-height:1.4em}
.btn{pointer-events:auto;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.12em;border:0;border-radius:14px;
  padding:12px 34px;background:var(--amber);color:#1b1400;cursor:pointer;box-shadow:0 0 0 3px rgba(255,201,74,.25),0 0 28px rgba(255,201,74,.45)}
.btn:focus-visible,.panel button:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;
  box-sizing:border-box;padding:24px 22px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;gap:14px}
.panel h1{margin:0;font-family:var(--display);font-weight:800;font-size:52px;line-height:1;letter-spacing:.08em;color:var(--volt-hot);
  text-shadow:0 0 18px rgba(150,200,255,.7),0 0 2px #fff;text-wrap:balance}
.sub{margin:0;font-size:14px;line-height:1.7;color:var(--ink)}
.how{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:13px;line-height:1.55;color:var(--mute)}
.how b{color:var(--ink);font-weight:700}
.levels{display:grid;gap:8px}
.levels button,.btns button{font-family:var(--body);font-size:15px;font-weight:700;text-align:left;cursor:pointer;
  border-radius:12px;border:1px solid var(--line);background:#161a38;color:var(--ink);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.levels button span{font-weight:400;font-size:12px;color:var(--mute)}
.levels button:hover,.btns button:hover{border-color:var(--volt)}
.levels button.best span{color:var(--amber)}
.grade{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;letter-spacing:.1em;text-align:center;color:var(--volt-hot);text-shadow:0 0 22px rgba(150,200,255,.75)}
.grade.miss{color:var(--mute);text-shadow:none}
.rline{text-align:center;font-size:14px;color:var(--ink);margin:0}
.score{text-align:center;font-variant-numeric:tabular-nums;color:var(--mute)}
.score b{font-size:40px;color:var(--amber);font-family:var(--display);font-weight:700}
.stars{text-align:center;font-size:26px;letter-spacing:.2em;color:var(--line)}
.stars .on{color:var(--amber)}
.rows{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.rows dt{color:var(--mute)}
.rows dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.rows dt small{display:block;font-size:11px;opacity:.75}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{justify-content:center}
.btns .primary{background:var(--amber);color:#1b1400;border-color:var(--amber)}
.btns .ghost{grid-column:1/-1;background:transparent}
.sound{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:auto;font-size:12px;
  background:rgba(10,12,29,.6);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
@media (max-height:620px){.panel h1{font-size:40px}.grade{font-size:48px}}
</style>

<canvas id="c" aria-label="游戏画面"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-l"><div class="lv" id="lvName"></div><div class="tg" id="tgName"></div></div>
  <div class="hud-r"><div class="chip" id="chip">画面稳定</div><div class="prog"><b id="prog">1</b> / 3 段</div></div>
</div>

<div class="bottom" id="bottom" hidden>
  <div class="hint" id="hint"></div>
  <button class="btn" id="go" hidden>开劈</button>
</div>
<button class="sound" id="sound" hidden>声音 开</button>

<section class="panel" id="menu">
  <h1>天打雷劈</h1>
  <p class="sub">闪电先敲鼓，你再跟着敲。<br>敲对了，就能劈中小坏蛋！</p>
  <ol class="how">
    <li>点一下<b>小坏蛋</b>，再按<b>开劈</b></li>
    <li>闪电敲“咚咚锵”时，<b>先听，别点</b></li>
    <li>轮到你了，跟着<b>一样的节奏</b>点亮亮的<b>小球</b></li>
    <li><b>最大的球别点</b>，它在给闪电带路</li>
  </ol>
  <div class="levels" id="levels"></div>
</section>

<section class="panel" id="result" hidden>
  <div class="grade" id="rGrade">天罚</div>
  <p class="rline" id="rLine"></p>
  <div class="score"><b id="rScore">0</b> / 100</div>
  <div class="stars" id="rStars"></div>
  <dl class="rows" id="rRows"></dl>
  <div class="btns">
    <button id="rAgain">再来一次</button>
    <button id="rNext" class="primary">下一关</button>
    <button id="rMenu" class="ghost">回到选关</button>
  </div>
</section>

    const cb = (1 + 2*r)*b, rb = (2 + 2*r)*b;

      G.calls.push({ t:cb + h*bt, type, r, i });
      G.resps.push({ t:rb + h*bt, type, r, i, done:false, res:null });
      G.aev.push({ t:cb + h*bt, f:type === 'd' ? 'dong' : 'qiang' });
    });
  });
  const bassRoots = [55, 55, 65.4, 73.4, 82.4, 73.4];   // A, A, C, D, E, D — pentatonic walk
  const totalBars = 1 + 2*ROUNDS.length;
  for (let bar = 0; bar < totalBars; bar++){
    const t = bar*b;
    if (bar === 0){ for (let k = 0; k < 4; k++) G.aev.push({ t:t + k*bt, f:'stick', a:k === 0 }); continue; }
    const r = Math.floor((bar - 1)/2), sec = SECTION_OF[r], isCall = (bar - 1) % 2 === 0;
    G.aev.push({ t, f:'kick', a:1 }); G.aev.push({ t:t + 2*bt, f:'kick', a:0.85 });
    if (sec >= 1) G.aev.push({ t:t + 2.5*bt, f:'kick', a:0.6 });
    G.aev.push({ t:t + bt, f:'clap' }); G.aev.push({ t:t + 3*bt, f:'clap' });
    if (sec >= 1) for (let k = 0; k < 8; k++) G.aev.push({ t:t + k*bt/2, f:'hat', a:k % 2 ? 0.05 : 0.09 });
    if (sec >= 1){ const root = bassRoots[r]; [[0, 1], [1.5, 1], [2, 1.5], [3, 1.335]].forEach(([o, m]) => G.aev.push({ t:t + o*bt, f:'bass', a:root*m*2 })); }
    if (sec >= 2 && !isCall) G.aev.push({ t:t + 3.5*bt, f:'smallGong' });
  }
  G.aev.sort((a, b2) => a.t - b2.t);
  G.landT = totalBars*b;
}
function scheduleAudio(now){
  if (!G.useAC) return;
  while (G.ai < G.aev.length && G.aev[G.ai].t < now + 0.15){
    const e = G.aev[G.ai++], at = G.t0 + e.t;
    if (e.t < now - 0.05) continue;
    if (e.f === 'dong') sfx.dong(at); else if (e.f === 'qiang') sfx.qiang(at);
    else if (e.f === 'kick') sfx.kick(at, e.a); else if (e.f === 'clap') sfx.clap(at);
    else if (e.f === 'hat') sfx.hat(at, e.a); else if (e.f === 'stick') sfx.stick(at, e.a);
    else if (e.f === 'bass') sfx.bass(at, e.a); else if (e.f === 'smallGong') sfx.smallGong(at);
  }
}
function barInfo(now){
  const bar = Math.floor(now/G.bar);
  if (bar < 1) return { bar, kind:'count', r:-1 };
  if (bar >= 1 + 2*ROUNDS.length) return { bar, kind:'land', r:ROUNDS.length - 1 };
  const r = Math.floor((bar - 1)/2);
  return { bar, kind:(bar - 1) % 2 === 0 ? 'call' : 'resp', r };
}

/* ---------------- leader mechanics ---------------- */
function mkSeg(x0, y0, x1, y1, id, gd){
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, nx = -dy/len, ny = dx/len;
  const j1 = rnd(-0.18, 0.18)*len, j2 = rnd(-0.18, 0.18)*len;
  return { p:[x0, y0, x0 + dx*0.33 + nx*j1, y0 + dy*0.33 + ny*j1, x0 + dx*0.66 + nx*j2, y0 + dy*0.66 + ny*j2, x1, y1], id, born:G.t, gd, deadAt:0 };
}
function settle(t){ const [x, y] = tipPos(t); t.px = x; t.py = y; }
function growTo(t, nx, ny, gd){
  settle(t);
  const px = t.x, py = t.y;   // segment starts from the tip's logical end
  ny = Math.min(ny, GROUND);
  t.px = px; t.py = py; t.x = nx; t.y = ny; t.born = G.t; t.gd = gd;
  t.path.push({ x:nx, y:ny });
  G.segs.push(mkSeg(px, py, nx, ny, t.id, gd));
}
function grow(t, len, gd){
  let nx = t.x + Math.cos(t.a)*len, ny = t.y + Math.sin(t.a)*len;
  if (ny > GROUND){ const k = (GROUND - t.y)/(ny - t.y); nx = t.x + (nx - t.x)*k; ny = GROUND; }
  growTo(t, nx, ny, gd);
}
function newTip(x, y, a){
  const id = G.idc++;
  return { id, x, y, px:x, py:y, a, path:[{x, y}], lineage:[id], born:G.t, gd:0.01, fresh:true };
}
function spawnBranch(m){
  const side = (m.x > lineX(m.y) ? 1 : -1)*(Math.random() < 0.8 ? 1 : -1) || 1;   // mostly away from the target line
  const nt = newTip(m.x, m.y, clamp(m.a + side*rnd(0.75, 1.0), 0.25, PI - 0.25));
  nt.path = m.path.slice(); nt.lineage = m.lineage.concat(nt.id);
  const nid = G.idc++; m.id = nid; m.lineage = m.lineage.concat(nid);
  G.tips.push(nt);
  grow(nt, rnd(1.2, 1.5), 0.15);
  return nt;
}
function refreshLive(){
  const live = new Set();
  for (const t of G.tips) for (const id of t.lineage) live.add(id);
  for (const s of G.segs) if (!live.has(s.id) && !s.deadAt) s.deadAt = G.t;
}
function pickMain(){
  let bestT = null, bd = 1e9;
  for (const t of G.tips){ const d = Math.abs(t.x - lineX(t.y)) - t.y*0.03; if (d < bd){ bd = d; bestT = t; } }
  G.main = bestT; G.mainSet = new Set(bestT ? bestT.lineage : []);
}
const smallTips = () => G.tips.filter(t => t !== G.main);
function bbox(list){
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const t of list){ x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x); y0 = Math.min(y0, t.y); y1 = Math.max(y1, t.y); }
  return { x0, x1, y0, y1 };
}
function fitScale(){
  if (!G.tips.length) return S.levels[0];
  const b = bbox(G.tips), bw = (b.x1 - b.x0) + 2.4, bh = (b.y1 - b.y0) + 5;
  return clamp(Math.min(S.playW*0.94/bw, H*0.8/bh), S.full, S.levels[0]);
}
// warning level = how many missed branches are still alive (fresh ones from this call don't count)
function warnLevel(){ const n = smallTips().filter(t => !t.fresh).length; return n === 0 ? 0 : n <= 2 ? 1 : 2; }
function kill(t){
  const i = G.tips.indexOf(t); if (i < 0) return;
  G.tips.splice(i, 1); refreshLive();
}
function updateLevel(){
  const L = warnLevel();
  if (L > G.level){ sfx.warn(L === 2); screenText(L === 1 ? '漏掉了，小心！' : '漏太多啦！', L === 1 ? '#ffc94a' : '#ff4d5e'); }
  else if (L < G.level) screenText('收回来了', '#bfe6ff');
  G.level = L;
}

/* ---- call: lightning sings one hit ---- */
function doCall(c){
  G.pulse = 1; G.cueFlash = 1;
  const m = G.main, vx = tgtX();
  // leftovers (small tips from earlier rounds) creep outward
  for (const t of smallTips()){ if (!t.fresh){ t.a += (t.x > lineX(t.y) ? -1 : 1)*0.12; t.a = clamp(t.a, 0.2, PI - 0.2); grow(t, 1.6, 0.15); } }
  // main steps toward the target
  const ta = Math.atan2(GROUND - m.y, vx - m.x);
  m.a += angDiff(ta, m.a)*0.3 + (Math.random() - 0.5)*0.45;
  m.a = clamp(m.a, 0.45, PI - 0.45);
  const steps = G.calls.length - G.ci + 1;
  const dyNeed = (GROUND - 3.5 - m.y - (ROUNDS.length - c.r)*CRAWL)/Math.max(1, steps);
  const len = clamp(dyNeed/Math.max(0.5, Math.sin(m.a)), 0.5, CALL_STEP*1.4);
  grow(m, len, 0.15);
  const nb = spawnBranch(m); nb.fresh = true;
  // cap: too many leftovers → oldest silently dies out
  const small = smallTips();
  if (small.length > 8){ const old = small.filter(t => !t.fresh).sort((a, b) => a.born - b.born)[0]; if (old) kill(old); }
  refreshLive(); pickMain();
  updateLevel();
  for (let i = 0; i < 6; i++) G.parts.push({ x:m.x, y:m.y, vx:rnd(-2, 2), vy:rnd(-2, 2), life:0.3, max:0.3, c:'#bfe6ff', sz:rnd(1, 2), g:0 });
}
/* ---- response bar begins: slow motion, small balls light up ---- */
function startResp(r){
  G.inResp = true;
  for (const t of G.tips) t.fresh = false;
  const b = bbox(G.tips.length ? G.tips : [{ x:0, y:0 }]);
  const s = fitScale();
  G.respCam = { x:(b.x0 + b.x1)/2, y:(b.y0 + b.y1)/2 + 0.1*H/s + CRAWL*0.5, s };
  for (const t of G.tips) grow(t, CRAWL, G.bar*0.95);   // super-slow crawl, never fully stops
  bigText('跟！', '#ffc94a');
}
function endResp(){ G.inResp = false; updateLevel(); }
function judgeMiss(rp){
  rp.done = true; rp.res = 'miss'; G.miss++; G.combo = 0; sfx.dull();
  tapText(W/2, H*0.32, '漏', '#ff4d5e');
}

/* ---------------- ending ---------------- */
function startLanding(){
  G.phase = 'land'; G.lt = 0; G.inResp = false;
  for (const t of G.tips) t.fresh = false;
  sfx.startSlow();
  screenText('要落地啦！', '#bfe6ff', 22);
  const m = G.main, vx = tgtX();
  const nx = m.x + clamp(vx - m.x, -3, 3);
  growTo(m, nx, GROUND, 2.2);
  for (const t of smallTips()) grow(t, 1.2, 2.2);
  setHint('');
}
function climbFrac(){ return Math.pow(clamp((G.ft - FIN.pause)/(FIN.climbEnd - FIN.pause - 0.15), 0, 1), 1.5); }
function boltPointAt(frac){
  const tot = G.rbCum[G.rbCum.length - 1], d = frac*tot;
  for (let i = 1; i < G.rb.length; i++){
    if (G.rbCum[i] >= d){ const k = (d - G.rbCum[i - 1])/((G.rbCum[i] - G.rbCum[i - 1]) || 1), a = G.rb[i - 1], b = G.rb[i]; return { x:a.x + (b.x - a.x)*k, y:a.y + (b.y - a.y)*k, i }; }
  }
  const e = G.rb[G.rb.length - 1]; return { x:e.x, y:e.y, i:G.rb.length - 1 };
}
function startFinale(tip){
  G.phase = 'finale'; G.ft = 0; G.winner = tip;
  const left = smallTips().length;
  const v = villain(), x = tip.x;
  let outcome = 'ground', hitObj = null;
  if (Math.abs(x - v.x) < 1.6){ outcome = 'hit'; hitObj = v; }
  else {
    let bd = 9;
    for (const o of G.objs){ if (o.villain) continue; const r = o.kind === 'pole' ? 1.0 : 1.15, d = Math.abs(x - o.x); if (d < r && d < bd){ bd = d; hitObj = o; outcome = o.kind; } }
  }
  G.outcome = outcome; G.hitObj = hitObj;
  const pts = [];
  for (let i = 0; i < tip.path.length; i++){
    const p = tip.path[i]; pts.push(p); const q = tip.path[i + 1];
    if (q){ const dx = q.x - p.x, dy = q.y - p.y, l = Math.hypot(dx, dy) || 1, j = rnd(-0.2, 0.2)*l; pts.push({ x:p.x + dx*0.5 - dy/l*j, y:p.y + dy*0.5 + dx/l*j }); }
  }
  G.bolt = pts; G.rb = pts.slice().reverse(); G.rbCum = [0];
  for (let i = 1; i < G.rb.length; i++) G.rbCum.push(G.rbCum[i - 1] + Math.hypot(G.rb[i].x - G.rb[i - 1].x, G.rb[i].y - G.rb[i - 1].y));
  sfx.stopBeds(0.12);
  const total = G.resps.length;
  const acc = clamp((G.perfect*2 + G.good)/(2*total) - G.wrong*0.05, 0, 1);
  const power = left === 0 ? 25 : left === 1 ? 18 : left === 2 ? 12 : left === 3 ? 7 : 3;
  const mult = outcome === 'hit' ? 1 : outcome === 'ground' ? 0.45 : 0.3;
  const score = Math.round((70*acc + 30*power/25)*mult);
  G.power = power; G.result = { acc, power, mult, score, left };
}
function strike(){
  G.flash = 1; G.shake = RM ? 0.12 : 0.6;
  const v = villain(), w = G.winner;
  for (let i = 0; i < 40; i++) G.parts.push({ x:w.x, y:GROUND - 0.1, vx:rnd(-6, 6), vy:rnd(-9, -2), life:rnd(0.4, 1), max:1, c:'#fff3b0', sz:rnd(1.5, 3), g:16 });
  if (G.outcome === 'hit'){
    v.state = 'char';
    worldText(v.x, GROUND - 2.6, G.power >= 25 ? '天罚！' : G.power >= 12 ? '焦了' : '麻了一下', '#ffc94a', 26);
  } else {
    v.state = 'flee'; v.dir = v.x >= w.x ? 1 : -1;
    worldText(v.x, GROUND - 2.4, '略略略～', '#e9ecff', 20);
    const o = G.hitObj;
    if (G.outcome === 'hen'){ o.state = 'char'; worldText(o.x, GROUND - 2.4, '咯咯哒？！', '#ff4d5e', 20);
      for (let i = 0; i < 18; i++) G.parts.push({ x:o.x, y:GROUND - 0.6, vx:rnd(-3, 3), vy:rnd(-5, -1), life:rnd(1, 2), max:2, c:'#f4efe6', sz:rnd(2, 4), g:3, feather:true }); }
    else if (G.outcome === 'pole'){ o.state = 'spark'; worldText(o.x, GROUND - 4, '全村停电', '#ff4d5e', 22); }
    else worldText(w.x, GROUND - 1.6, '劈了个寂寞', '#959bc8', 18);
  }
}
function showResult(){
  const r = G.result, o = G.outcome, v = G.L.villainName;
  const grade = o !== 'hit' ? '劈歪了' : (r.power >= 25 && r.acc >= 0.8) ? '天罚' : r.power >= 12 ? '粗雷' : '细雷';
  const lines = {
    hit: grade === '天罚' ? `${v}被劈成了爆炸头！` : grade === '粗雷' ? `劈中了！漏了几下，雷没那么粗` : `小叉剩太多，${v}只是麻了一下`,
    hen: `劈到老母鸡了！${v}趁机跑了`,

    `<dt>最多连对</dt><dd>${G.maxCombo} 下</dd>` +
    `<dt>雷有多粗<small>还剩 ${r.left} 条小叉没点掉</small></dt><dd>${r.power} / 25</dd>` +
    `<dt>劈到了谁</dt><dd>${resultName}</dd>`;
  $('rNext').textContent = G.lv === LEVELS.length - 1 ? '从头再来' : '下一关';
  if (!best[G.lv] || r.score > best[G.lv]){ best[G.lv] = r.score; try { localStorage.setItem('tdlp-rhythm-best', JSON.stringify(best)); } catch(e){} }
  $('result').hidden = false; $('hud').hidden = true; $('bottom').hidden = true;
}

const rain = [];

$('rMenu').addEventListener('click', () => { sfx.stopBeds(0.2); newGame(G.lv, 'menu'); buildMenu(); $('result').hidden = true; $('menu').hidden = false; $('hud').hidden = true; $('bottom').hidden = true; });
$('sound').addEventListener('click', () => { sfx.on = !sfx.on; if (!sfx.on) sfx.stopBeds(0.1); $('sound').textContent = sfx.on ? '声音 开' : '声音 关'; });

cv.addEventListener('pointerdown', e => {
  const x = e.clientX, y = e.clientY;
  if (G.phase === 'select'){
    const v = villain(), [sx, sy] = w2s(v.x, GROUND - 0.5);
    if (Math.hypot(x - sx, y - sy) < Math.max(44, 1.3*cam.s)) selectTarget();
    return;
  }
  if (G.phase !== 'play') return;
  const now = clock(), bi = barInfo(now);
  // nearest pending expected hit (may sit just across the bar line if the tap is a little early)
  let rp = null, rd = 1e9;
  for (const q of G.resps){ if (q.done) continue; const d = Math.abs(now - q.t); if (d < rd){ rd = d; rp = q; } }
  if (!rp || rd > WIN_G){
    if (bi.kind === 'call'){ tapText(x, y - 24, '先听，别点', '#959bc8'); return; }
    sfx.dull(); G.combo = 0; tapText(x, y - 24, '没跟上节奏', '#ff4d5e'); return;
  }
  // which ball?
  let hit = null, hd = 1e9;
  for (const t of G.tips){ const [sx, sy] = w2s(...tipPos(t)); const d = Math.hypot(x - sx, y - sy); if (d < 46 && d < hd){ hd = d; hit = t; } }
  if (!hit){ sfx.dull(); tapText(x, y - 24, '没点到球', '#959bc8'); return; }
  const perfect = rd <= WIN_P;
  rp.done = true;
  const [wx, wy] = tipPos(hit);
  if (hit === G.main){
    rp.res = 'wrong'; G.wrong++; G.combo = 0; G.shake = RM ? 0 : 0.25;
    sfx.pa(sfx.now(), false, false); sfx.dull();
    tapText(x, y - 28, '哎呀，点到大球了', '#ff4d5e');
    kill(hit); pickMain();
    if (G.main) tapText(...w2s(...tipPos(G.main)).map((v, i) => i ? v - 24 : v), '换它带路', '#bfe6ff');
  } else {
    rp.res = perfect ? 'perfect' : 'good';
    if (perfect) G.perfect++; else G.good++;
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    sfx.pa(sfx.now(), rp.type === 'q', perfect);
    tapText(x, y - 28, perfect ? '啪！真准' : '啪！', perfect ? '#ffc94a' : '#bfe6ff');
    kill(hit); pickMain();
  }
  for (let i = 0; i < 16; i++) G.parts.push({ x:wx, y:wy, vx:rnd(-3, 3), vy:rnd(-3, 3), life:rnd(0.2, 0.5), max:0.5, c:perfect ? '#ffc94a' : '#bfe6ff', sz:rnd(1, 2.5), g:0 });
});
function tipPos(t){

/* ---------------- update ---------------- */
function camTarget(){

  path(); ctx.strokeStyle = `rgba(190,220,255,${0.55*a})`; ctx.lineWidth = base*2.2; ctx.stroke();

  if (front){
    const [fx, fy] = w2s(front.x, front.y), R = 34 + 8*Math.sin(ft*50);
    const rg = ctx.createRadialGradient(fx, fy, 0, fx, fy, R);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.35, 'rgba(200,225,255,0.8)'); rg.addColorStop(1, 'rgba(150,190,255,0)');
    ctx.fillStyle = rg; circle(fx, fy, R);
  }
  ctx.restore();
}
function drawParts(){
  for (const p of G.parts){
    const [sx, sy] = w2s(p.x, p.y), a = clamp(p.life/p.max, 0, 1);
    if (p.smoke){ ctx.fillStyle = `rgba(110,112,130,${0.35*a})`; circle(sx, sy, p.sz*(2 - a)*cam.s/22); continue; }
    ctx.fillStyle = p.c; ctx.globalAlpha = a;
    if (p.feather){ ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.life*3); ctx.fillRect(-p.sz, -p.sz/3, p.sz*2, p.sz*0.7); ctx.restore(); }
    else circle(sx, sy, p.sz);
    ctx.globalAlpha = 1;
  }
}
function drawTexts(world){
  ctx.textAlign = 'center';
  for (const t of G.texts){
    if (t.world !== world) continue;
    const a = clamp(t.life/t.max*2, 0, 1), rise = (1 - t.life/t.max)*30;
    let x, y; if (world){ [x, y] = w2s(t.x, t.y); } else { x = t.sx; y = t.sy; }
    ctx.font = `bold ${t.sz}px ${FONT_D}`; ctx.globalAlpha = a;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(8,10,24,0.85)'; ctx.strokeText(t.txt, x, y - rise);
    ctx.fillStyle = t.c; ctx.fillText(t.txt, x, y - rise);
    ctx.globalAlpha = 1;
  }
}

/* ---------------- characters ---------------- */
function ell(x, y, rx, ry, rot){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, 2*PI); ctx.fill(); }
function drawObj(o){
  const [sx, gy] = w2s(o.x, GROUND), u = cam.s;
  if (o.kind !== 'pole' && (sx < -u*2 || sx > W + u*2)) return;
  ctx.save(); ctx.translate(sx, gy); ctx.scale(u, u); ctx.lineWidth = 1.5/u;
  const ch = o.state === 'char';
  const bob = o.state === 'idle' && o.villain ? Math.abs(Math.sin(G.t*(o.amp ? 9 : 3)))*0.06 : o.state === 'flee' ? Math.abs(Math.sin(G.t*18))*0.12 : 0;
  ctx.translate(0, -bob);
  if (o.kind === 'pole'){ drawPole(o, u); ctx.restore(); return; }
  if (o.kind === 'hen'){ drawHen(ch); ctx.restore(); return; }
  ctx.scale(o.dir || 1, 1);
  const pal = { weasel:['#b9773d', '#e7c08a'], cat:['#d48a3f', '#f1d2a4'], rat:['#8c8c9a', '#c9c9d4'] }[o.kind];
  const body = ch ? '#18181c' : pal[0], belly = ch ? '#26262c' : pal[1];
  ctx.fillStyle = body;
  if (o.kind === 'rat'){ ctx.strokeStyle = ch ? '#18181c' : '#d9a0a8'; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.moveTo(-0.5, -0.25); ctx.quadraticCurveTo(-1.1, -0.1, -1.2, -0.6); ctx.stroke(); }
  else ell(-0.82, -0.55, 0.38, 0.11, -0.6);
  ell(0, -0.36, o.kind === 'rat' ? 0.55 : 0.72, o.kind === 'cat' ? 0.32 : 0.27);
  ctx.fillStyle = belly; ell(0.1, -0.26, 0.42, 0.13);
  ctx.fillStyle = body; [-0.4, -0.15, 0.25, 0.45].forEach((lx, i) => { const sw = o.state === 'flee' || (o.amp && G.phase === 'play') ? Math.sin(G.t*20 + i*1.6)*0.06 : 0; ctx.fillRect(lx + sw - 0.05, -0.2, 0.1, 0.2); });
  const hx = o.kind === 'rat' ? 0.55 : 0.66, hy = o.kind === 'cat' ? -0.72 : -0.6, hr = o.kind === 'cat' ? 0.3 : 0.26;
  ctx.fillStyle = body;
  if (o.kind === 'cat'){ ctx.beginPath(); ctx.moveTo(hx - 0.25, hy - 0.12); ctx.lineTo(hx - 0.18, hy - 0.45); ctx.lineTo(hx - 0.02, hy - 0.22); ctx.moveTo(hx + 0.05, hy - 0.22); ctx.lineTo(hx + 0.2, hy - 0.45); ctx.lineTo(hx + 0.27, hy - 0.1); ctx.fill(); }
  if (o.kind === 'rat'){ ctx.fillStyle = ch ? '#18181c' : '#d9a0a8'; circle(hx - 0.12, hy - 0.24, 0.13); ctx.fillStyle = body; }
  if (o.kind === 'weasel'){ circle(hx - 0.1, hy - 0.22, 0.08); }
  circle(hx, hy, hr);
  ell(hx + hr*0.85, hy + 0.05, 0.16, 0.11);
  if (!ch && o.kind === 'weasel'){ ctx.fillStyle = '#3a2410'; ell(hx + 0.06, hy - 0.04, 0.24, 0.07); }
  if (!ch && o.kind === 'cat'){ ctx.strokeStyle = '#8a4f1d'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(-0.3, -0.62); ctx.lineTo(-0.25, -0.45); ctx.moveTo(-0.05, -0.66); ctx.lineTo(0, -0.48); ctx.moveTo(0.2, -0.64); ctx.lineTo(0.24, -0.47); ctx.stroke(); }
  ctx.fillStyle = ch ? '#000' : '#2a1a1a'; circle(hx + hr + 0.12, hy + 0.02, 0.045);
  ctx.fillStyle = '#fff'; circle(hx + 0.1, hy - 0.05, ch ? 0.08 : 0.06);
  ctx.fillStyle = '#000'; if (!ch) circle(hx + 0.12, hy - 0.04, 0.03);
  if (!ch){ ctx.strokeStyle = '#1a0f05'; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(hx - 0.02, hy - 0.17); ctx.lineTo(hx + 0.2, hy - 0.11); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx + 0.18, hy + 0.09, 0.07, 0.2, 1.4); ctx.stroke(); }
  if (!ch){
    if (o.kind === 'weasel'){ ctx.fillStyle = '#f7f1e3'; ell(hx + hr + 0.22, hy + 0.15, 0.13, 0.17, 0.3); }
    if (o.kind === 'cat'){ ctx.fillStyle = '#9fb4c8'; ell(hx + hr + 0.28, hy + 0.12, 0.22, 0.07); ctx.beginPath(); ctx.moveTo(hx + hr + 0.48, hy + 0.12); ctx.lineTo(hx + hr + 0.62, hy + 0.02); ctx.lineTo(hx + hr + 0.62, hy + 0.22); ctx.fill(); }
    if (o.kind === 'rat'){ ctx.fillStyle = '#e8c35a'; ell(hx + hr + 0.16, hy + 0.12, 0.12, 0.06, 0.4); ell(hx + hr + 0.2, hy + 0.2, 0.12, 0.06, -0.3); }
  } else { ctx.fillStyle = '#0d0d10'; for (let i = 0; i < 6; i++) circle(hx - 0.25 + i*0.1, hy - 0.3 - Math.sin(i*1.3)*0.08, 0.14); }
  ctx.restore();
}
function drawHen(ch){
  ctx.fillStyle = ch ? '#18181c' : '#f2ede2'; ell(0, -0.45, 0.42, 0.36);
  ell(-0.38, -0.6, 0.16, 0.22, -0.5);
  circle(0.28, -0.88, 0.2);
  ctx.fillStyle = ch ? '#2a2a30' : '#d9342b'; circle(0.24, -1.1, 0.07); circle(0.33, -1.1, 0.07); circle(0.4, -1.03, 0.06);
  ctx.fillStyle = ch ? '#2a2a30' : '#f1b432'; ctx.beginPath(); ctx.moveTo(0.46, -0.9); ctx.lineTo(0.62, -0.84); ctx.lineTo(0.46, -0.79); ctx.fill();
  ctx.fillStyle = '#fff'; circle(0.33, -0.92, ch ? 0.07 : 0.045); if (!ch){ ctx.fillStyle = '#000'; circle(0.34, -0.92, 0.025); }
  ctx.strokeStyle = ch ? '#18181c' : '#f1b432'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(-0.08, -0.1); ctx.lineTo(-0.08, 0); ctx.moveTo(0.1, -0.1); ctx.lineTo(0.1, 0); ctx.stroke();
}
function drawPole(o, u){
  ctx.fillStyle = '#5a4330'; ctx.fillRect(-0.08, -3, 0.16, 3);
  ctx.fillRect(-0.55, -2.65, 1.1, 0.1);
  ctx.fillStyle = '#9fb0c8'; circle(-0.45, -2.7, 0.06); circle(0.45, -2.7, 0.06);
  ctx.strokeStyle = 'rgba(40,40,60,0.9)'; ctx.lineWidth = 1/u; ctx.beginPath();
  for (const dx of [-0.45, 0.45]){ ctx.moveTo(dx, -2.7); ctx.quadraticCurveTo(dx + 6, -2.1, dx + 12, -2.7); ctx.moveTo(dx, -2.7); ctx.quadraticCurveTo(dx - 6, -2.1, dx - 12, -2.7); }
  ctx.stroke();
  if (o.state === 'spark'){ ctx.fillStyle = `rgba(190,230,255,${0.5 + 0.5*Math.sin(G.t*40)})`; circle(0, -2.7, 0.25); }
}

/* ---------------- boot ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}
addEventListener('resize', resize);
newGame(0, 'menu'); resize(); buildMenu();
requestAnimationFrame(frame);
})();
</script>
