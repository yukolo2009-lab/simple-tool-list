<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>天打雷劈</title>
<style>
/* Layout: full-bleed storm canvas; HUD pinned to the safe edges; menus float as one card in the middle */
:root{
  --night:#0a0c1d; --storm:#1b1f3f; --panel:rgba(13,15,36,.9); --line:#2e3466;
  --volt:#bfe6ff; --volt-hot:#ffffff; --amber:#ffc94a; --alarm:#ff4d5e; --ink:#e9ecff; --mute:#959bc8;
  --display:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud-l{display:grid;gap:2px;min-width:0}
.lv{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--volt-hot)}
.tg{font-size:12px;color:var(--mute)}
.hud-r{display:grid;justify-items:end;gap:6px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--volt);background:rgba(10,12,29,.6);letter-spacing:.06em}
.chip.y{color:#1b1400;background:var(--amber);border-color:var(--amber)}
.chip.r{color:#fff;background:var(--alarm);border-color:var(--alarm)}
.prog{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog b{color:var(--ink);font-size:15px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  display:grid;justify-items:center;gap:10px;pointer-events:none}
.beats{display:flex;gap:10px}
.beats i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .08s,transform .08s}
.beats i.on{background:var(--volt-hot);transform:scale(1.5);box-shadow:0 0 12px var(--volt)}
.beats i.on.acc{background:var(--amber);box-shadow:0 0 14px var(--amber)}
.bottom.mid{bottom:auto;top:54%}
.bottom.mid .beats{display:none}
.hint{font-size:13px;color:var(--mute);text-align:center;max-width:32em}
.btn{pointer-events:auto;font-family:var(--display);font-size:22px;letter-spacing:.12em;border:0;border-radius:14px;
  padding:12px 34px;background:var(--amber);color:#1b1400;cursor:pointer;box-shadow:0 0 0 3px rgba(255,201,74,.25),0 0 28px rgba(255,201,74,.45)}
.btn:focus-visible,.panel button:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;
  box-sizing:border-box;padding:24px 22px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;gap:14px}
.panel h1{margin:0;font-family:var(--display);font-weight:800;font-size:52px;line-height:1;letter-spacing:.08em;color:var(--volt-hot);
  text-shadow:0 0 18px rgba(150,200,255,.7),0 0 2px #fff;text-wrap:balance}
.sub{margin:0;font-size:14px;line-height:1.7;color:var(--ink)}
.how{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:13px;line-height:1.55;color:var(--mute)}
.how b{color:var(--ink);font-weight:700}
.levels{display:grid;gap:8px}
.levels button,.btns button{font-family:var(--body);font-size:15px;font-weight:700;text-align:left;cursor:pointer;
  border-radius:12px;border:1px solid var(--line);background:#161a38;color:var(--ink);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.levels button span{font-weight:400;font-size:12px;color:var(--mute)}
.levels button:hover,.btns button:hover{border-color:var(--volt)}
.levels button.best span{color:var(--amber)}
.grade{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;letter-spacing:.1em;text-align:center;color:var(--volt-hot);text-shadow:0 0 22px rgba(150,200,255,.75)}
.grade.miss{color:var(--mute);text-shadow:none}
.rline{text-align:center;font-size:14px;color:var(--ink);margin:0}
.score{text-align:center;font-variant-numeric:tabular-nums;color:var(--mute)}
.score b{font-size:40px;color:var(--amber);font-family:var(--display);font-weight:400}
.stars{text-align:center;font-size:26px;letter-spacing:.2em;color:var(--line)}
.stars .on{color:var(--amber)}
.rows{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.rows dt{color:var(--mute)}
.rows dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.rows dt small{display:block;font-size:11px;opacity:.75}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{justify-content:center}
.btns .primary{background:var(--amber);color:#1b1400;border-color:var(--amber)}
.btns .ghost{grid-column:1/-1;background:transparent}
.sound{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:auto;font-size:12px;
  background:rgba(10,12,29,.6);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
@media (max-height:620px){.panel h1{font-size:40px}.grade{font-size:48px}}
</style>

<canvas id="c" aria-label="游戏画面"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-l"><div class="lv" id="lvName"></div><div class="tg" id="tgName"></div></div>
  <div class="hud-r"><div class="chip" id="chip">画面稳定</div><div class="prog" id="progWrap"><b id="prog">0</b> / 42 步</div></div>
</div>

<div class="bottom" id="bottom" hidden>
  <div class="beats" id="beats"><i></i><i></i><i></i><i></i></div>
  <div class="hint" id="hint"></div>
  <button class="btn" id="go" hidden>开劈</button>
</div>
<button class="sound" id="sound" hidden>声音 开</button>

<section class="panel" id="menu">
  <h1>天打雷劈</h1>
  <p class="sub">闪电劈下来之前，会先伸出一根很细的先导，一路分叉往下摸路。跟着节拍掐掉跑偏的支叉，把它领到小坏蛋头上。</p>
  <ol class="how">
    <li><b>点坏蛋</b>，锁定目标，再按“开劈”</li>
    <li>镜头推近，<b>点光球</b>掐掉多余支叉，粗的那条是主干</li>
    <li>支叉跑出画面，镜头拉远，画面变黄、变红；再漏就失控</li>
    <li>快落地时进入慢动作；先导一碰地，回击从地面冲回云层，再一记劈下。剪得越干净，雷越粗</li>
  </ol>
  <div class="levels" id="levels"></div>
</section>

<section class="panel" id="result" hidden>
  <div class="grade" id="rGrade">天罚</div>
  <p class="rline" id="rLine"></p>
  <div class="score"><b id="rScore">0</b> / 100</div>
  <div class="stars" id="rStars"></div>
  <dl class="rows" id="rRows"></dl>
  <div class="btns">
    <button id="rAgain">再来一次</button>
    <button id="rNext" class="primary">下一关</button>
    <button id="rMenu" class="ghost">回到选关</button>
  </div>
</section>

  ac:null, on:true,
  init(){

  return { p:[x0, y0, x0 + dx*0.33 + nx*j1, y0 + dy*0.33 + ny*j1, x0 + dx*0.66 + nx*j2, y0 + dy*0.66 + ny*j2, x1, y1], id, faint, born:G.t, gd:growDur(), deadAt:0 };
}
function grow(t, len){
  const px = t.x, py = t.y;
  let nx = px + Math.cos(t.a)*len, ny = py + Math.sin(t.a)*len;
  if (ny > GROUND){ const k = (GROUND - py)/(ny - py); nx = px + (nx - px)*k; ny = GROUND; }
  t.px = px; t.py = py; t.x = nx; t.y = ny; t.born = G.t; t.gd = growDur();
  t.path.push({ x:nx, y:ny });
  G.segs.push(mkSeg(px, py, nx, ny, t.id, t.faint));
}
const growDur = () => G.slow ? 0.55 : 0.12;
function newTip(x, y, a){
  const id = G.idc++;
  return { id, x, y, px:x, py:y, a, path:[{x, y}], lineage:[id], faint:false, life:0, born:G.t };
}
function fork(t, forceSide){
  const side = forceSide || (Math.random() < 0.5 ? -1 : 1);
  const nt = newTip(t.x, t.y, clamp(t.a + side*rnd(0.5, 0.85), 0.35, PI - 0.35));
  nt.path = t.path.slice(); nt.lineage = t.lineage.concat(nt.id);
  const nid = G.idc++; t.id = nid; t.lineage = t.lineage.concat(nid);
  t.a -= side*0.12;
  const tapN = G.tips.filter(x => !x.faint).length;
  if (tapN >= 5 || (G.level >= 1 && Math.random() < 0.5)){ nt.faint = true; nt.life = 2; }
  G.tips.push(nt);
  grow(nt, rnd(0.55, 0.8));
  if (!nt.faint) sfx.crackle();
}
function refreshLive(){
  const live = new Set();
  for (const t of G.tips) for (const id of t.lineage) live.add(id);
  for (const s of G.segs) if (!live.has(s.id) && !s.deadAt) s.deadAt = G.t;
}
function pickMain(){
  let best = null, bd = 1e9;
  for (const t of G.tips){ if (t.faint) continue; const d = Math.abs(t.x - lineX(t.y)) - t.y*0.02; if (d < bd){ bd = d; best = t; } }
  G.main = best; G.mainSet = new Set(best ? best.lineage : []);
}
function tappable(){ return G.tips.filter(t => !t.faint); }
function maxTipY(){ let m = 0; for (const t of G.tips) if (!t.faint) m = Math.max(m, t.y); return m; }
function bbox(list){
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const t of list){ x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x); y0 = Math.min(y0, t.y); y1 = Math.max(y1, t.y); }
  return { x0, x1, y0, y1 };
}
function fitLevel(){
  const tt = tappable(); if (!tt.length) return 0;
  const b = bbox(tt), bw = (b.x1 - b.x0) + 1.6, bh = (b.y1 - b.y0) + 3.4;
  for (let l = 0; l < 3; l++){ const s = S.levels[l]; if (bw*s <= S.playW*0.94 && bh*s <= H*0.86) return l; }
  return 3;
}
function kill(t){
  const i = G.tips.indexOf(t); if (i < 0) return;
  G.tips.splice(i, 1); refreshLive(); pickMain();
}

function onBeat(){
  G.beat++; G.lastBeat = G.t; G.pulse = 1;
  const dur = G.runaway ? 0.13 : G.slow ? 1.1 : Math.max(0.36, G.L.beat - G.beat*0.004);
  G.nextBeat = G.t + dur;
  if (!G.runaway) sfx.kick(G.beat % 4 === 1); else sfx.crackle();
  const vx = tgtX();
  for (const t of G.tips.slice()){
    if (t.faint){ t.life--; if (t.life <= 0){ kill(t); continue; } }
    let ta = Math.atan2(GROUND - t.y, vx - t.x), pull = 0.13;
    if (G.runaway){ ta = PI/2 - (t.side || 0)*0.45; pull = 0.3; }
    else for (const o of G.objs){
      if (o.kind !== 'pole') continue;
      const dx = o.x - t.x, dy = (GROUND - 2.6) - t.y, d = Math.hypot(dx, dy);
      if (d < 5.5 && t.y > GROUND - 10) t.a += angDiff(Math.atan2(dy, dx), t.a)*0.24*(1 - d/5.5);
    }
    t.a += angDiff(ta, t.a)*pull + (Math.random() - 0.5)*(G.runaway ? 0.3 : 0.55);
    if (t.x < -10) t.a = Math.min(t.a, 1.2);
    if (t.x > 10) t.a = Math.max(t.a, PI - 1.2);
    t.a = clamp(t.a, 0.4, PI - 0.4);
    grow(t, rnd(1.0, 1.25));
  }
  // faint leaders that reach the ground just die out
  for (const t of G.tips.slice()) if (t.faint && t.y >= GROUND) kill(t);
  pickMain();
  if (!G.runaway && G.beat > 1){
    // ramp: first stretch 1 new branch per beat (1→2), then up to 2 (2→4); never 3 at once
    const prog = maxTipY()/GROUND;
    const stage = prog < 0.35 ? 1 : 2;
    if (stage > G.stage){ G.stage = stage; screenText('分叉变多了 · 一拍最多两条', '#d2aaff'); }
    let budget = G.slow ? 1 : stage;
    const main = G.main;
    const order = G.tips.filter(t => !t.faint && t.y < GROUND - 1.4).sort((a, b) => (b === main) - (a === main));
    for (const t of order){
      if (budget <= 0) break;
      const r = Math.random();
      if (t === main){
        if (budget >= 2 && r < 0.35){ fork(t, -1); fork(t, 1); budget -= 2; }
        else if (r < 0.82){ fork(t); budget--; }
      } else if (r < 0.3){ fork(t); budget--; }
    }
  }
  refreshLive(); pickMain();

  const landed = tappable().filter(t => t.y >= GROUND);
  if (landed.length){
    landed.sort((a, b) => Math.abs(a.x - vx) - Math.abs(b.x - vx));
    startFinale(landed[0]); return;
  }
  if (!G.slow && !G.runaway && maxTipY() >= GROUND - 6.5){
    G.slow = true; G.nextBeat = G.t + 1.1; sfx.startSlow();
    screenText('慢动作 · 快落地了', '#bfe6ff', 22);
  }
  if (G.runaway) return;
  const L = fitLevel();
  if (L >= 3){ goRunaway(); return; }
  if (L > G.level){ sfx.warn(L === 2); screenText(L === 1 ? '支叉跑出画面 · 黄色警告' : '又漏了 · 红色警告', L === 1 ? '#ffc94a' : '#ff4d5e'); }
  else if (L < G.level) screenText('收回来了', '#bfe6ff');
  G.level = L;
  G.levelBeats[G.level]++;
}
function goRunaway(){
  G.runaway = true; G.level = 2; sfx.warn(true);
  screenText('失控了！', '#ff4d5e', 34);
  const vx = tgtX(); let worst = null, wd = -1;
  for (const t of tappable()){ const d = Math.abs(t.x - lineX(t.y)); if (d > wd){ wd = d; worst = t; } }
  G.tips = [worst]; worst.side = Math.sign(worst.x - vx) || 1;
  refreshLive(); pickMain(); G.levelBeats[2] += 4;
  setHint('先导失控，自己往下冲了……');
}

/* ---------------- ending ---------------- */
function startFinale(tip){
  G.phase = 'finale'; G.ft = 0; G.winner = tip;
  const live = tappable().length;
  const v = villain(), x = tip.x;
  let outcome = 'ground', hitObj = null;
  if (Math.abs(x - v.x) < 1.5){ outcome = 'hit'; hitObj = v; }
  else {
    let bd = 9;
    for (const o of G.objs){ if (o.villain) continue; const r = o.kind === 'pole' ? 1.0 : 1.15, d = Math.abs(x - o.x); if (d < r && d < bd){ bd = d; hitObj = o; outcome = o.kind; } }
  }
  G.outcome = outcome; G.hitObj = hitObj;
  // bolt points
  const pts = [];
  for (let i = 0; i < tip.path.length; i++){
    const p = tip.path[i]; pts.push(p);
    const q = tip.path[i + 1];
    if (q){ const dx = q.x - p.x, dy = q.y - p.y, l = Math.hypot(dx, dy) || 1; const j = rnd(-0.22, 0.22)*l; pts.push({ x:p.x + dx*0.5 - dy/l*j, y:p.y + dy*0.5 + dx/l*j }); }
  }
  G.bolt = pts;
  G.rb = pts.slice().reverse(); G.rbCum = [0];
  for (let i = 1; i < G.rb.length; i++) G.rbCum.push(G.rbCum[i - 1] + Math.hypot(G.rb[i].x - G.rb[i - 1].x, G.rb[i].y - G.rb[i - 1].y));
  sfx.stopBeds(0.12);
  // scoring
  const vx = v.x; let dev = 0;
  for (const p of tip.path) dev += Math.abs(p.x - vx*p.y/GROUND);
  dev /= tip.path.length;
  const acc = Math.round(35*clamp(1 - dev/3.5, 0, 1));
  const lb = G.levelBeats, tot = Math.max(1, lb[0] + lb[1] + lb[2]);
  const camS = Math.round(25*clamp((lb[0] + 0.4*lb[1])/tot, 0, 1));
  const rhythm = G.taps ? Math.round(15*G.perfect/G.taps) : 6;
  const power = G.runaway ? 3 : live === 1 ? 25 : live === 2 ? 14 : 6;
  const mult = outcome === 'hit' ? 1 : outcome === 'ground' ? 0.45 : 0.3;
  const score = Math.round((acc + camS + rhythm + power)*mult);
  G.power = power; G.result = { acc, camS, rhythm, power, mult, score, live, dev };
  setHint('');
}
function climbFrac(){ return Math.pow(clamp((G.ft - FIN.pause)/(FIN.climbEnd - FIN.pause - 0.15), 0, 1), 1.5); }
function boltPointAt(frac){
  const tot = G.rbCum[G.rbCum.length - 1], d = frac*tot;
  for (let i = 1; i < G.rb.length; i++){
    if (G.rbCum[i] >= d){ const k = (d - G.rbCum[i - 1])/((G.rbCum[i] - G.rbCum[i - 1]) || 1), a = G.rb[i - 1], b = G.rb[i]; return { x:a.x + (b.x - a.x)*k, y:a.y + (b.y - a.y)*k, i }; }
  }
  const e = G.rb[G.rb.length - 1]; return { x:e.x, y:e.y, i:G.rb.length - 1 };
}
function strike(){
  G.flash = 1; G.shake = RM ? 0.12 : 0.6;
  const v = villain(), w = G.winner;
  for (let i = 0; i < 40; i++) G.parts.push({ x:w.x, y:GROUND - 0.1, vx:rnd(-6, 6), vy:rnd(-9, -2), life:rnd(0.4, 1), max:1, c:'#fff3b0', sz:rnd(1.5, 3), g:16 });
  if (G.outcome === 'hit'){
    v.state = 'char';
    worldText(v.x, GROUND - 2.6, G.power >= 25 ? '天罚！' : G.power >= 14 ? '焦了' : '麻了一下', '#ffc94a', 26);
  } else {
    v.state = 'flee'; v.dir = v.x >= w.x ? 1 : -1;
    worldText(v.x, GROUND - 2.4, '略略略～', '#e9ecff', 20);
    const o = G.hitObj;
    if (G.outcome === 'hen'){ o.state = 'char'; worldText(o.x, GROUND - 2.4, '咯咯哒？！', '#ff4d5e', 20);
      for (let i = 0; i < 18; i++) G.parts.push({ x:o.x, y:GROUND - 0.6, vx:rnd(-3, 3), vy:rnd(-5, -1), life:rnd(1, 2), max:2, c:'#f4efe6', sz:rnd(2, 4), g:3, feather:true }); }
    else if (G.outcome === 'pole'){ o.state = 'spark'; worldText(o.x, GROUND - 4, '全村停电', '#ff4d5e', 22); }
    else worldText(w.x, GROUND - 1.6, '劈了个寂寞', '#959bc8', 18);
  }
}
function showResult(){
  const r = G.result, o = G.outcome, v = G.L.villainName;
  const grade = o !== 'hit' ? (G.runaway ? '失控' : '劈歪了') : r.power >= 25 ? '天罚' : r.power >= 14 ? '粗雷' : '细雷';
  const lines = {
    hit: r.power >= 25 ? `${v}被劈成了爆炸头，一路干干净净` : r.power >= 14 ? `劈中了，可惜分了点电，雷不够粗` : `支叉太多，电全分散了，${v}只是麻了一下`,
    hen: `劈中了无辜的老母鸡，${v}趁乱跑了`,
    pole: `雷被电线杆截走了，${v}大摇大摆跑了`,
    ground: `劈在泥地上，${v}溜之大吉`
  };
  $('rGrade').textContent = grade; $('rGrade').className = 'grade' + (o === 'hit' ? '' : ' miss');
  $('rLine').textContent = lines[o];
  $('rScore').textContent = r.score;
  const stars = r.score >= 85 ? 3 : r.score >= 65 ? 2 : r.score >= 40 ? 1 : 0;
  $('rStars').innerHTML = [0,1,2].map(i => `<span class="${i < stars ? 'on' : ''}">★</span>`).join('');
  const resultName = { hit:'劈中 ×1', hen:'劈到母鸡 ×0.3', pole:'劈到电线杆 ×0.3', ground:'劈空 ×0.45' }[o];
  $('rRows').innerHTML =
    `<dt>准度<small>主干离虚线平均 ${r.dev.toFixed(1)} 步</small></dt><dd>${r.acc} / 35</dd>` +
    `<dt>镜头<small>近景 ${G.levelBeats[0]} 拍 · 黄 ${G.levelBeats[1]} · 红 ${G.levelBeats[2]}</small></dt><dd>${r.camS} / 25</dd>` +
    `<dt>节拍<small>踩点 ${G.perfect} / ${G.taps} 次</small></dt><dd>${r.rhythm} / 15</dd>` +
    `<dt>雷势<small>落地时还剩 ${r.live} 条先导</small></dt><dd>${r.power} / 25</dd>` +
    `<dt>结局</dt><dd>${resultName}</dd>`;
  const isLast = G.lv === LEVELS.length - 1;
  $('rNext').textContent = isLast ? '从头再来' : '下一关';
  if (!best[G.lv] || r.score > best[G.lv]){ best[G.lv] = r.score; try { localStorage.setItem('tdlp-best', JSON.stringify(best)); } catch(e){} }
  $('result').hidden = false; $('hud').hidden = true; $('bottom').hidden = true;
  setTimeout(() => { try { $('rNext').focus({ preventScroll:true }); } catch(e){} }, 50);
}

/* ---------------- effects ---------------- */
function worldText(x, y, txt, c, sz){ G.texts.push({ x, y, txt, c, sz:sz || 18, life:1.6, max:1.6, world:true }); }
function screenText(txt, c, sz){ G.texts.push({ sx:W/2, sy:H*0.3, txt, c, sz:sz || 20, life:1.3, max:1.3, world:false }); }
function tapText(sx, sy, txt, c){ G.texts.push({ sx, sy, txt, c, sz:16, life:0.7, max:0.7, world:false }); }
const rain = [];
function newDrop(any){ return { x:Math.random()*(W + 200) - 100, y:any ? Math.random()*H : -20, l:rnd(10, 22), v:rnd(500, 800) }; }

/* ---------------- UI wiring ---------------- */
let hintText = '';
function setHint(t){ if (t !== hintText){ hintText = t; $('hint').textContent = t; } }
function buildMenu(){
  $('levels').innerHTML = LEVELS.map((L, i) => {
    const b = best[i]; const sub = (L.villain.amp ? (i === 2 ? '目标乱窜' : '目标会走') : '目标不动') + (b != null ? ` · 最高 ${b}` : '');
    return `<button data-i="${i}" class="${b != null ? 'best' : ''}">${L.name} · ${L.villainName}<span>${sub}</span></button>`;
  }).join('');
  $('levels').querySelectorAll('button').forEach(b => b.addEventListener('click', () => startLevel(+b.dataset.i)));
}
function startLevel(i){
  sfx.init(); sfx.loadSamples(); sfx.stopBeds(0.2);
  newGame(i, 'select');
  $('menu').hidden = true; $('result').hidden = true;
  $('hud').hidden = false; $('bottom').hidden = false; $('sound').hidden = false;
  $('lvName').textContent = G.L.name; $('tgName').textContent = '目标：' + G.L.villainName;
  $('go').hidden = true; $('bottom').classList.add('mid'); setHint('点一下' + G.L.villainName + '，锁定目标');
}
function selectTarget(){
  if (G.selected) return;
  G.selected = true; sfx.select();
  $('go').hidden = false; setHint('虚线就是理想路线 · 准备好就开劈');
}
function begin(){
  if (G.phase !== 'select') return;
  sfx.init(); if (!G.selected){ G.selected = true; }
  $('go').hidden = true; $('bottom').classList.remove('mid');
  G.phase = 'zoomin'; G.zt = 0;
  const t = newTip(0, 0, PI/2); G.tips = [t]; pickMain();
  setHint('点光球掐掉跑偏的支叉 · 粗的那条是主干');
  sfx.loadSamples(); sfx.startBed();
}
$('go').addEventListener('click', begin);
$('rAgain').addEventListener('click', () => startLevel(G.lv));
$('rNext').addEventListener('click', () => startLevel((G.lv + 1) % LEVELS.length));
$('rMenu').addEventListener('click', () => { sfx.stopBeds(0.2); newGame(G.lv, 'menu'); buildMenu(); $('result').hidden = true; $('menu').hidden = false; $('hud').hidden = true; $('bottom').hidden = true; });
$('sound').addEventListener('click', () => { sfx.on = !sfx.on; if (!sfx.on) sfx.stopBeds(0.1); $('sound').textContent = sfx.on ? '声音 开' : '声音 关'; });
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && G.phase === 'select' && document.activeElement === document.body){ e.preventDefault(); begin(); } });

cv.addEventListener('pointerdown', e => {
  const x = e.clientX, y = e.clientY;
  if (G.phase === 'select'){
    const v = villain(), [sx, sy] = w2s(v.x, GROUND - 0.5);
    if (Math.hypot(x - sx, y - sy) < Math.max(44, 1.3*cam.s)) selectTarget();
    else if (G.selected) {} // ignore stray taps
    return;
  }
  if (G.phase !== 'play' || G.runaway) return;
  let hit = null, hd = 1e9;
  for (const t of tappable()){
    const [sx, sy] = w2s(...tipPos(t)); const d = Math.hypot(x - sx, y - sy);
    if (d < 34 && d < hd){ hd = d; hit = t; }
  }
  if (!hit) return;
  if (tappable().length <= 1){ sfx.deny(); tapText(x, y - 24, '至少留一条', '#ff4d5e'); return; }
  const off = Math.min(G.t - G.lastBeat, G.nextBeat - G.t);
  const perfect = off < (G.slow ? 0.3 : 0.14);
  G.taps++; if (perfect) G.perfect++;
  sfx.zap(perfect);
  const [wx, wy] = tipPos(hit);
  for (let i = 0; i < 14; i++) G.parts.push({ x:wx, y:wy, vx:rnd(-3, 3), vy:rnd(-3, 3), life:rnd(0.2, 0.5), max:0.5, c:perfect ? '#ffc94a' : '#bfe6ff', sz:rnd(1, 2.5), g:0 });
  tapText(x, y - 26, perfect ? '踩点！' : '掐', perfect ? '#ffc94a' : '#bfe6ff');
  if (hit === G.main) tapText(x, y - 46, '主干换了一条', '#959bc8');
  kill(hit);
  const L = fitLevel(); if (L < G.level){ G.level = L; screenText('收回来了', '#bfe6ff'); }
});
function tipPos(t){
  const k = clamp((G.t - t.born)/(t.gd || 0.12), 0, 1);
  return [t.px + (t.x - t.px)*k, t.py + (t.y - t.py)*k];
}

/* ---------------- update ---------------- */
function camTarget(){
  if ((G.phase === 'finale' || G.phase === 'result') && G.rb){
    const ft = G.ft;
    if (ft < FIN.pause) return { x:cam.x, y:cam.y, s:cam.s };
    if (ft < FIN.climbEnd){ const p = boltPointAt(climbFrac()), s = S.levels[0]*1.15; return { x:p.x, y:p.y - 0.08*H/s, s, sp:14 }; }
    if (ft < FIN.impact) return { x:0, y:GROUND/2 + 2, s:S.full, sp:7 };
    return { x:G.winner.x, y:GROUND - 2.2, s:S.levels[0]*0.95, sp:4 };
  }
  if (G.phase === 'zoomin' || (G.phase === 'play' && !G.runaway)){
    const s = S.levels[G.level], tt = tappable();
    if (!tt.length) return { x:0, y:0, s };
    const b = bbox(tt);
    if (G.slow){
      const bw = (b.x1 - b.x0) + 2.6, bh = (GROUND + 1.4) - b.y0 + 1;
      const s2 = Math.max(S.full, Math.min(S.levels[0]*1.5, S.playW*0.94/bw, H*0.74/bh));
      return { x:(b.x0 + b.x1)/2, y:(b.y0 + GROUND + 1.4)/2, s:s2 };
    }
    return { x:(b.x0 + b.x1)/2, y:(b.y0 + b.y1)/2 + 0.12*H/s, s };
  }
  return { x:0, y:GROUND/2 + 2, s:S.full };
}
function update(dt){
  G.t += dt;
  const rdt = dt*((G.slow && G.phase === 'play') || (G.phase === 'finale' && G.ft < FIN.impact) ? 0.2 : 1);
  for (const d of rain){ d.y += d.v*rdt; d.x -= d.v*0.18*rdt; if (d.y > H + 30) Object.assign(d, newDrop(false)); }
  const ts = G.slow && G.phase === 'play' ? 0.3 : 1;
  if (G.phase === 'play' || G.phase === 'zoomin') G.playT += dt*ts;
  const v = villain();
  if (v.state === 'idle' && v.amp && (G.phase === 'play' || G.phase === 'zoomin')){
    const nx = v.x0 + v.amp*Math.sin(G.playT*v.freq*2); if (Math.abs(nx - v.x) > 1e-4) v.dir = nx > v.x ? 1 : -1; v.x = nx;
  }
  if (v.state === 'flee') v.x += v.dir*7*dt;
  for (const o of G.objs){
    if (o.state === 'char' && Math.random() < dt*7) G.parts.push({ x:o.x + rnd(-0.3, 0.3), y:GROUND - 1.1, vx:rnd(-0.3, 0.3), vy:rnd(-1.6, -0.9), life:1.6, max:1.6, c:'#6a6d80', sz:rnd(4, 8), g:-0.2, smoke:true });

  ctx.scale(o.dir || 1, 1);
  const pal = { weasel:['#b9773d', '#e7c08a'], cat:['#d48a3f', '#f1d2a4'], rat:['#8c8c9a', '#c9c9d4'] }[o.kind];
  const body = ch ? '#18181c' : pal[0], belly = ch ? '#26262c' : pal[1];
  // tail
  ctx.fillStyle = body;
  if (o.kind === 'rat'){ ctx.strokeStyle = ch ? '#18181c' : '#d9a0a8'; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.moveTo(-0.5, -0.25); ctx.quadraticCurveTo(-1.1, -0.1, -1.2, -0.6); ctx.stroke(); }
  else ell(-0.82, -0.55, 0.38, 0.11, -0.6);
  // body
  ell(0, -0.36, o.kind === 'rat' ? 0.55 : 0.72, o.kind === 'cat' ? 0.32 : 0.27);
  ctx.fillStyle = belly; ell(0.1, -0.26, 0.42, 0.13);
  // legs
  ctx.fillStyle = body; [-0.4, -0.15, 0.25, 0.45].forEach((lx, i) => { const sw = o.state === 'flee' || (o.amp && G.phase === 'play') ? Math.sin(G.t*20 + i*1.6)*0.06 : 0; ctx.fillRect(lx + sw - 0.05, -0.2, 0.1, 0.2); });
  // head
  const hx = o.kind === 'rat' ? 0.55 : 0.66, hy = o.kind === 'cat' ? -0.72 : -0.6, hr = o.kind === 'cat' ? 0.3 : 0.26;
  ctx.fillStyle = body;
  if (o.kind === 'cat'){ ctx.beginPath(); ctx.moveTo(hx - 0.25, hy - 0.12); ctx.lineTo(hx - 0.18, hy - 0.45); ctx.lineTo(hx - 0.02, hy - 0.22); ctx.moveTo(hx + 0.05, hy - 0.22); ctx.lineTo(hx + 0.2, hy - 0.45); ctx.lineTo(hx + 0.27, hy - 0.1); ctx.fill(); }
  if (o.kind === 'rat'){ ctx.fillStyle = ch ? '#18181c' : '#d9a0a8'; circle(hx - 0.12, hy - 0.24, 0.13); ctx.fillStyle = body; }
  if (o.kind === 'weasel'){ circle(hx - 0.1, hy - 0.22, 0.08); }
  circle(hx, hy, hr);
  ell(hx + hr*0.85, hy + 0.05, 0.16, 0.11);
  // mask / stripes
  if (!ch && o.kind === 'weasel'){ ctx.fillStyle = '#3a2410'; ell(hx + 0.06, hy - 0.04, 0.24, 0.07); }
  if (!ch && o.kind === 'cat'){ ctx.strokeStyle = '#8a4f1d'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(-0.3, -0.62); ctx.lineTo(-0.25, -0.45); ctx.moveTo(-0.05, -0.66); ctx.lineTo(0, -0.48); ctx.moveTo(0.2, -0.64); ctx.lineTo(0.24, -0.47); ctx.stroke(); }
  // nose
  ctx.fillStyle = ch ? '#000' : '#2a1a1a'; circle(hx + hr + 0.12, hy + 0.02, 0.045);
  // eyes + sly brow
  ctx.fillStyle = '#fff'; circle(hx + 0.1, hy - 0.05, ch ? 0.08 : 0.06);
  ctx.fillStyle = '#000'; if (!ch) circle(hx + 0.12, hy - 0.04, 0.03);
  if (!ch){ ctx.strokeStyle = '#1a0f05'; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(hx - 0.02, hy - 0.17); ctx.lineTo(hx + 0.2, hy - 0.11); ctx.stroke();
    ctx.strokeStyle = '#1a0f05'; ctx.beginPath(); ctx.arc(hx + 0.18, hy + 0.09, 0.07, 0.2, 1.4); ctx.stroke(); }
  // loot
  if (o.state !== 'char'){
    if (o.kind === 'weasel'){ ctx.fillStyle = '#f7f1e3'; ell(hx + hr + 0.22, hy + 0.15, 0.13, 0.17, 0.3); }
    if (o.kind === 'cat'){ ctx.fillStyle = '#9fb4c8'; ell(hx + hr + 0.28, hy + 0.12, 0.22, 0.07); ctx.beginPath(); ctx.moveTo(hx + hr + 0.48, hy + 0.12); ctx.lineTo(hx + hr + 0.62, hy + 0.02); ctx.lineTo(hx + hr + 0.62, hy + 0.22); ctx.fill(); }
    if (o.kind === 'rat'){ ctx.fillStyle = '#e8c35a'; ell(hx + hr + 0.16, hy + 0.12, 0.12, 0.06, 0.4); ell(hx + hr + 0.2, hy + 0.2, 0.12, 0.06, -0.3); }
  } else {
    // afro puff
    ctx.fillStyle = '#0d0d10'; for (let i = 0; i < 6; i++) circle(hx - 0.25 + i*0.1, hy - 0.3 - Math.sin(i*1.3)*0.08, 0.14);
  }
  ctx.restore();
}
function drawHen(ch){
  ctx.fillStyle = ch ? '#18181c' : '#f2ede2'; ell(0, -0.45, 0.42, 0.36);
  ell(-0.38, -0.6, 0.16, 0.22, -0.5);
  circle(0.28, -0.88, 0.2);
  ctx.fillStyle = ch ? '#2a2a30' : '#d9342b'; circle(0.24, -1.1, 0.07); circle(0.33, -1.1, 0.07); circle(0.4, -1.03, 0.06);
  ctx.fillStyle = ch ? '#2a2a30' : '#f1b432'; ctx.beginPath(); ctx.moveTo(0.46, -0.9); ctx.lineTo(0.62, -0.84); ctx.lineTo(0.46, -0.79); ctx.fill();
  ctx.fillStyle = '#fff'; circle(0.33, -0.92, ch ? 0.07 : 0.045); if (!ch){ ctx.fillStyle = '#000'; circle(0.34, -0.92, 0.025); }
  ctx.strokeStyle = ch ? '#18181c' : '#f1b432'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(-0.08, -0.1); ctx.lineTo(-0.08, 0); ctx.moveTo(0.1, -0.1); ctx.lineTo(0.1, 0); ctx.stroke();
}
function drawPole(o, u){
  ctx.fillStyle = '#5a4330'; ctx.fillRect(-0.08, -3, 0.16, 3);
  ctx.fillRect(-0.55, -2.65, 1.1, 0.1);
  ctx.fillStyle = '#9fb0c8'; circle(-0.45, -2.7, 0.06); circle(0.45, -2.7, 0.06);
  ctx.strokeStyle = 'rgba(40,40,60,0.9)'; ctx.lineWidth = 1/u; ctx.beginPath();
  for (const dx of [-0.45, 0.45]){ ctx.moveTo(dx, -2.7); ctx.quadraticCurveTo(dx + 6, -2.1, dx + 12, -2.7); ctx.moveTo(dx, -2.7); ctx.quadraticCurveTo(dx - 6, -2.1, dx - 12, -2.7); }
  ctx.stroke();
  if (o.state === 'spark'){ ctx.fillStyle = `rgba(190,230,255,${0.5 + 0.5*Math.sin(G.t*40)})`; circle(0, -2.7, 0.25); }
}

/* ---------------- boot ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}
addEventListener('resize', resize);
newGame(0, 'menu'); resize(); buildMenu();
requestAnimationFrame(frame);
})();
</script>
